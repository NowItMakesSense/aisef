name: AISEF verify
description: >-
  Barra a PR quando o log de auditoria do AISEF foi adulterado (cadeia, Ed25519, head versionado, log que so cresce
  desde a base), quando o aisef-check acusa erro ou quando a PR toca uma tarefa executada e nao validada.
  Usa so as chaves publicas do projeto. Faca o checkout com fetch-depth 0 para o modo PR.
inputs:
  project:
    description: Raiz do repositorio com .aisef/
    default: "."
  pr:
    description: "true: confere o log contra a base e as tarefas tocadas pela PR"
    default: "true"
  base:
    description: Ref da branch base (modo PR)
    default: origin/main
  strict:
    description: "true: avisos do aisef-check tambem falham"
    default: "true"
  now:
    description: Relogio do aisef-check em ISO 8601 (so para projetos de demonstracao com datas fixas)
    default: ""
  stamp:
    description: "true: carimbo de tempo RFC 3161 do ultimo evento na TSA de audit.tsa_url (sem rede vira aviso)"
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install --quiet --require-hashes -r "$GITHUB_ACTION_PATH/../../../requirements-dev.lock"
    - shell: bash
      # H-05: entradas por variavel de ambiente, nunca interpoladas no script (injecao de comando)
      env:
        AISEF_CORE: ${{ github.action_path }}/../../../plugins/aisef/core
        IN_PROJECT: ${{ inputs.project }}
        IN_PR: ${{ inputs.pr }}
        IN_BASE: ${{ inputs.base }}
        IN_STRICT: ${{ inputs.strict }}
        IN_NOW: ${{ inputs.now }}
        IN_STAMP: ${{ inputs.stamp }}
      run: |
        args=(--project "$IN_PROJECT" --summary "$GITHUB_STEP_SUMMARY")
        [ "$IN_PR" = "true" ] && args+=(--pr --base "$IN_BASE")
        [ "$IN_STRICT" = "true" ] || args+=(--no-strict)
        [ -n "$IN_NOW" ] && args+=(--now "$IN_NOW")
        [ "$IN_STAMP" = "true" ] && args+=(--stamp)
        python -I "$AISEF_CORE/aisef_ci.py" "${args[@]}"
