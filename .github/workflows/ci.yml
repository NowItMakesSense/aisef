name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python run_tests.py
      - name: manifestos do plugin e do marketplace sao JSON validos e com a mesma versao
        run: |
          python - <<'PY'
          import json
          p = json.load(open("plugins/aisef/.claude-plugin/plugin.json", encoding="utf-8"))
          m = json.load(open(".claude-plugin/marketplace.json", encoding="utf-8"))
          versions = {e.get("version") for e in m.get("plugins", []) if e.get("name") == "aisef"} - {None}
          assert not versions or versions == {p["version"]}, (p["version"], versions)
          print("ok", p["version"])
          PY
      - name: latencia dos hooks (informativo)
        run: python tools/bench_hooks.py --runs 5

  aisef-verify-demo:
    # T-01: a Action aisef-verify rodando sobre o projeto de demonstracao (log assinado, chave publica, head versionado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -I plugins/aisef/core/make_demo_project.py demo/.aisef
          printf '{"project_id": "PRJ-1", "schema_version": "0.1.0"}' > demo/.aisef/config.json
      - uses: ./.github/actions/aisef-verify
        with:
          project: demo
          pr: "false"
          now: "2026-11-05T15:00:00-03:00"
