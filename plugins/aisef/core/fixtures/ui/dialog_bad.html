<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dialog_bad</title><style>body{font:16px/1.5 system-ui,sans-serif;margin:16px}button{min-width:24px;min-height:24px}#dlg{border:1px solid #333;padding:16px}</style></head><body><button type="button" id="open" class="a">Abrir janela</button><button type="button" id="open2" class="b">Abrir outra</button><div id="dlg" role="dialog" hidden><button type="button" id="x">Fechar</button></div><script>var d=document.getElementById('dlg');document.getElementById('open').onclick=function(){d.hidden=false;document.getElementById('x').focus();};document.getElementById('open2').onclick=function(){d.hidden=false;d.dataset.sticky=1;document.getElementById('x').focus();};addEventListener('keydown',function(e){if(e.key==='Escape'&&!d.dataset.sticky){d.hidden=true;document.body.focus();}});document.getElementById('x').onclick=function(){d.hidden=true;delete d.dataset.sticky;};</script></body></html>
