<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dialog_ok</title><style>body{font:16px/1.5 system-ui,sans-serif;margin:16px}button{min-width:24px;min-height:24px}#dlg{border:1px solid #333;padding:16px}</style></head><body><button type="button" id="open">Abrir janela</button><div id="dlg" role="dialog" hidden><button type="button" id="x">Fechar</button></div><script>var d=document.getElementById('dlg'),o=document.getElementById('open');o.onclick=function(){d.hidden=false;document.getElementById('x').focus();};function c(){d.hidden=true;o.focus();}addEventListener('keydown',function(e){if(e.key==='Escape')c();});document.getElementById('x').onclick=c;</script></body></html>
