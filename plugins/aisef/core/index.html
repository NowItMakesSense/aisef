    yb.hidden = !pend; yb.textContent = ""; yb.appendChild(icon("i-hand")); yb.appendChild(document.createTextNode(plural(pend, "decisão sua", "decisões suas")));
    // aviso de integridade e de contrato invalido: so existe quando ha o que avisar (um no vazio no grid do main abria
    // 20 px em branco no topo de todas as telas)
    var prev = document.getElementById("integrity"); if (prev) prev.remove();
    document.body.removeAttribute("data-integrity");
    var boxes = [];
    if (ig.status !== "ok") boxes.push(integrityCard(ig, m));
    if (ig.status === "broken") document.body.setAttribute("data-integrity", "broken");
    (D.source_errors || []).forEach(function (s) { boxes.push(el("div", { cls: "ibox warning", role: "status" }, [el("div", { text: "Contrato ignorado por ser inválido: " + s.file + " — " + (s.errors || []).join("; ") + ". Rode o aisef-check." })])); });
    if (boxes.length) { var view = document.getElementById("view"); view.parentNode.insertBefore(el("div", { id: "integrity", cls: "ibox-list" }, boxes), view); }
    document.getElementById("foot").textContent = "Gerado em " + when(m.generated_at) + " · construtor " + m.builder_version + " · log " + (m.source.log_id || "—") +
      " até a sequência " + (m.source.head_sequence === null ? "—" : m.source.head_sequence) + (IS_LIVE ? "" : " · página estática: use build_panel.py --serve para acompanhar ao vivo");
    tickLive();
  }
  var openedAt = Date.now(), lastOk = Date.now(), fails = 0, pendingData = null, lastGen = null, lastPaint = Date.now();
  function tickLive() {
    var li = document.getElementById("live"), tx = document.getElementById("livetxt");
    if (!IS_LIVE) { li.setAttribute("data-s", "static"); tx.textContent = "estático · gerado " + when(D.manifest.generated_at); li.title = ""; return; }
    var age = (Date.now() - lastOk) / 1000, s = fails >= 3 ? "down" : fails >= 1 ? "retry" : age > 10 ? "stale" : "live";
    li.setAttribute("data-s", s);
    /* tempo ativo: desde que o painel abriu; a ultima leitura do servidor fica no title */
    tx.textContent = s === "down" ? "servidor parou" : s === "retry" ? "reconectando…" : s === "stale" ? "parado há " + Math.round(age) + " s"
      : "ao vivo · ativo há " + dur(Date.now() - openedAt);
    li.title = "Aberto às " + hhmm(new Date(openedAt).toISOString()) + " · última leitura há " + Math.max(0, Math.round(age)) + " s";
  }
  /* os tempos decorridos (rodando há, esperando você há) andam sozinhos: repinta a cada 30 s quando nada mudou */
  function tickClock() {
    if (!IS_LIVE || document.hidden || busy() || Date.now() - lastPaint < 30000) return;
    render(false);
  }

  /* ====================================== render e reconciliacao ====================================== */
  function render(first) {
    var y = window.scrollY, open = {};
    Array.prototype.forEach.call(view.querySelectorAll("details[data-dk]"), function (d) { open[d.getAttribute("data-dk")] = d.open; });
    var SCR = ".mapwrap,.lanes,.rcol > .share,.fb-list", scrolls = {};
    var scrollKeys = {};
    Array.prototype.forEach.call(view.querySelectorAll(SCR), function (w, i) { scrolls[i] = [w.scrollLeft, w.scrollTop]; scrollKeys[i] = w.getAttribute("data-k"); });
    renderRail(); renderTop();
    var sec = el("section", { cls: "screen", "data-screen": cur });
    SCREENS[cur]().forEach(function (n) { if (n) sec.appendChild(n); });
    sec.appendChild(el("div", { cls: "foot", id: "foot-mirror" }));
    view.textContent = ""; view.appendChild(sec);
    Array.prototype.forEach.call(view.querySelectorAll("details[data-dk]"), function (d) { var k = d.getAttribute("data-dk"); if (Object.prototype.hasOwnProperty.call(open, k)) d.open = open[k]; });
    Array.prototype.forEach.call(view.querySelectorAll(SCR), function (w, i) {
      if (scrolls[i] && w.getAttribute("data-k") === scrollKeys[i]) { w.scrollLeft = scrolls[i][0]; w.scrollTop = scrolls[i][1]; }
      else if (w.hasAttribute("data-end")) w.scrollLeft = w.scrollWidth;  // linha do tempo abre no mais recente
    });
    markPan();
    lastPaint = Date.now();
    document.getElementById("foot-mirror").textContent = document.getElementById("foot").textContent;
    if (drawerId && drawerId.indexOf("agent:") === 0) openAgent(drawerId.slice(6), false); else if (drawerId) openDrawer(drawerId, false);
    document.title = NAMES[cur] + " · Painel AISEF";
    if (!first) window.scrollTo(0, y);
  }
  function route() {
    var raw = ""; try { raw = decodeURIComponent(location.hash.replace(/^#/, "")); } catch (e) { raw = ""; }
    var name = raw.split("/")[0]; name = ALIAS[name] || name;
    if (!NAMES[name]) name = "agora";
    var changed = name !== cur; cur = name;
    render(true);
    if (changed) { window.scrollTo(0, 0); var h = view.querySelector("h1"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); } }
  }
  function busy() {
    var ae = document.activeElement, tn = ae && ae.tagName;
    return !!(pan || (window.getSelection && String(window.getSelection())) || tn === "INPUT" || tn === "TEXTAREA" || document.getElementById("zoom").open || palette.classList.contains("open"));
  }
  function applyData(nd) {
    var prev = (D.approvals.pending || []).map(function (a) { return a.request_id; }), prevSt = D.manifest.integrity.status;
    D = nd; render(false);
    (D.approvals.pending || []).forEach(function (a) { if (prev.indexOf(a.request_id) < 0) announce("Nova decisão pendente: " + a.title); });
    if (prevSt !== D.manifest.integrity.status) announce("Integridade do histórico: " + D.manifest.integrity.status);
  }
  function announce(t) { var a = document.getElementById("announce"); a.textContent = ""; setTimeout(function () { a.textContent = t; }, 50); }
  function poll() {
    fetch("panel-data.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("http"); return r.json(); }).then(function (nd) {
      fails = 0; lastOk = Date.now();
      if (nd && nd.manifest && nd.manifest.generated_at !== lastGen) { lastGen = nd.manifest.generated_at; pendingData = nd; }
      if (pendingData && !busy()) { var x = pendingData; pendingData = null; applyData(x); }
      setTimeout(poll, 3000);
    }).catch(function () { fails++; setTimeout(poll, Math.min(12000, 3000 * Math.pow(2, fails))); });
  }

  /* ====================================== busca global (Ctrl K) e atalhos ====================================== */
  var palette = document.getElementById("palette"), pin = document.getElementById("p-input"), plist = document.getElementById("p-list"), psel = 0, presults = [];
  function index() {
    var out = [];
    B().tasks.forEach(function (t) { out.push({ k: "fatia", id: t.task_id, t: t.title, st: t.st, go: function () { openDrawer(t.task_id, true); } }); });
    (D.features || []).forEach(function (f) { out.push({ k: "feature", id: f.feature_id, t: f.title, go: function () { location.hash = "#fatias"; } }); });
    (D.rtm || []).forEach(function (r) { out.push({ k: "requisito", id: r.requirement_id, t: r.statement, go: function () { location.hash = "#rastro"; } }); });
    (D.approvals.pending || []).concat(D.approvals.recent || []).forEach(function (a) { out.push({ k: "decisão", id: a.request_id, t: a.title, go: function () { location.hash = "#gov"; } }); });
    (D.agents || []).forEach(function (a) { out.push({ k: "agente", id: a.agent_id, t: a.name, go: function () { location.hash = "#agentes"; } }); });
    (D.timeline || []).slice(0, 80).forEach(function (e) { out.push({ k: "evento", id: "#" + e.sequence, t: e.summary, go: function () { location.hash = "#hist"; } }); });
    Object.keys(NAMES).forEach(function (k) { out.push({ k: "tela", id: NAMES[k], t: "ir para " + NAMES[k], go: function () { location.hash = "#" + k; } }); });
    return out;
  }
  function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function searchRender() {
    var q = norm(pin.value).trim(), all = index();
    presults = (q ? all.filter(function (r) { return norm(r.id + " " + r.t + " " + r.k).indexOf(q) >= 0; }) : all.filter(function (r) { return r.k === "fatia" || r.k === "tela"; })).slice(0, 30);
    psel = Math.min(psel, Math.max(0, presults.length - 1));
    plist.textContent = "";
    if (!presults.length) plist.appendChild(el("li", { "aria-disabled": "true" }, [el("span"), el("span", { cls: "t", text: "Nada encontrado." }), el("span")]));
    presults.forEach(function (r, i) {
      var li = el("li", { role: "option", "aria-selected": String(i === psel), id: "pr" + i }, [r.st ? glyph(r.st) : el("span", { cls: "k", text: r.k }), el("span", { cls: "t", text: r.id + " · " + r.t }), el("span", { cls: "k", text: r.k })]);
      li.addEventListener("click", function () { choose(i); });
      plist.appendChild(li);
    });
    pin.setAttribute("aria-activedescendant", presults.length ? "pr" + psel : "");
  }
  function choose(i) { var r = presults[i]; closeSearch(); if (r) r.go(); }
  // quem abriu a busca recebe o foco de volta ao fechar (a sonda de UI achou o foco caindo no body)
  var searchOpener = null;
  function openSearch() {
    var a = document.activeElement; searchOpener = a && a !== document.body && !palette.contains(a) ? a : null;
    palette.classList.add("open"); pin.value = ""; psel = 0; searchRender(); pin.focus();
  }
  function closeSearch() {
    var had = palette.contains(document.activeElement), o = searchOpener; searchOpener = null;
    palette.classList.remove("open"); if (pendingData) { var x = pendingData; pendingData = null; applyData(x); }
    if (had && o && document.contains(o) && o.getClientRects().length) o.focus();
  }
  pin.addEventListener("input", function () { psel = 0; searchRender(); });
  pin.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { psel = Math.min(presults.length - 1, psel + 1); searchRender(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { psel = Math.max(0, psel - 1); searchRender(); e.preventDefault(); }

  document.getElementById("search").addEventListener("click", openSearch);
  document.getElementById("search").addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSearch(); } });
  document.getElementById("searchbtn").addEventListener("click", openSearch);
  var gPending = 0;
  document.addEventListener("keydown", function (e) {
    var tn = e.target && e.target.tagName, typing = tn === "INPUT" || tn === "TEXTAREA";

    if (e.key === "t") toggleTheme();
  });
  function toggleTheme() {
    root.dataset.theme = isDark() ? "light" : "dark"; store("theme", root.dataset.theme); mmCache = {}; render(false);
  }
  document.getElementById("theme").addEventListener("click", toggleTheme);
  document.getElementById("d-close").addEventListener("click", closeDrawer);
  document.getElementById("zoom-close").addEventListener("click", function () { document.getElementById("zoom").close(); });
  document.getElementById("youbtn").addEventListener("click", function () { location.hash = "#gov"; });

  /* ====================================== autoteste (test_panel.py, Chrome sem dependencias) ====================================== */
  function selftest() {
    var out = { overflow: {}, kept: {} };
    Object.keys(NAMES).forEach(function (k) { cur = k; render(true); out.overflow[k] = document.documentElement.scrollWidth - window.innerWidth; });
    cur = "agora"; render(true);
    var t = B().tasks[0];
    feat = t ? t.feature_id : "";
    if (t) openDrawer(t.task_id, false);
    render(false);
    window.scrollTo(0, 120);
    var y = window.scrollY;
    applyData(JSON.parse(JSON.stringify(D)));
    out.kept = { feature: feat === (t ? t.feature_id : ""), drawer: drawerId === (t ? t.task_id : null), scroll: window.scrollY === y };
    // arrastar com o mouse rola o mapa/raias; o clique que fecha o arrasto nao abre a gaveta; o clique simples abre
    closeDrawer(); feat = ""; cur = "mapa"; render(false);  // o mapa e as raias moram no Mapa dos agentes
    var w = Array.prototype.filter.call(view.querySelectorAll(PAN), scrollable)[0];
    if (!w && (w = view.querySelector(".mapwrap"))) { w.style.maxWidth = "240px"; w.style.maxHeight = "160px"; markPan(); }  // o mapa coube: aperta para testar o gesto
    if (w) {
      w.scrollLeft = 0;
      var tg = w.querySelector("[data-open]") || w, r = tg.getBoundingClientRect(), cx = r.left + 10, cy = r.top + r.height / 2;
      function fire(type, x) { tg.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerType: "mouse", button: 0, pointerId: 7, clientX: x, clientY: cy })); }
      fire("pointerdown", cx + 120); fire("pointermove", cx + 60); fire("pointermove", cx);
      var during = busy() && w.classList.contains("panning");
      fire("pointerup", cx); tg.click();
      var dragged = w.scrollLeft > 0, noOpen = drawerId === null;
      fire("pointerdown", cx); fire("pointerup", cx); tg.click();
      out.pan = { cursor: w.classList.contains("can-pan"), scrolled: dragged, busy_during: during, released: !pan && !w.classList.contains("panning"),
                  drag_no_click: noOpen, click_opens: tg === w || drawerId === tg.getAttribute("data-open") };
      closeDrawer();
    } else out.pan = null;
    document.getElementById("selftest").textContent = JSON.stringify(out);
  }

  function boot() {
    if (!D) { view.appendChild(el("p", { cls: "empty", text: "data.js não encontrado. Gere os dados com build_panel.py e deixe data.js ao lado desta página." })); return; }
    var th = store("theme"); if (th === "dark" || th === "light") root.dataset.theme = th;
    lastGen = D.manifest.generated_at;
    window.addEventListener("hashchange", route);
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: dark)"), onTheme = function () { mmCache = {}; render(false); };
      if (mq.addEventListener) mq.addEventListener("change", onTheme); else if (mq.addListener) mq.addListener(onTheme);
    }

    setInterval(function () { if (!document.hidden) { tickLive(); tickClock(); } }, 1000);
    if (IS_LIVE) setTimeout(poll, 3000);
    if (/[?&]selftest=1/.test(location.search)) selftest();
  }
  boot();
})();
