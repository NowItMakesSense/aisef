<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AISEF Painel</title>
<style>
/* ============================ tokens ("o livro-razao do projeto") ============================ */
:root{color-scheme:light dark;
  --bg:#F4F6F3;--surface:#FFFFFF;--surface-2:#EAEFEB;--ink:#15201B;--muted:#4F5F57;--line:#D8DFDA;--line-strong:#B7C2BB;
  --ledger:#0B6E4F;--ledger-soft:#E2F1EA;--on-ledger:#FFFFFF;--on-deny:#FFFFFF;--amber:#9A5B00;--amber-soft:#FBEFD9;--deny:#B3261E;--deny-soft:#FBE3E1;
  --idle:#5E6D65;--focus:#0B6E4F;--shadow:0 8px 24px rgb(0 0 0 / .18);
  --display:"Segoe UI Variable Display","SF Pro Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:system-ui,"Segoe UI Variable Text","Segoe UI",-apple-system,sans-serif;
  --mono:"Cascadia Mono","SF Mono",Consolas,ui-monospace,monospace;
  --r-sm:4px;--r-md:8px;--r-lg:14px}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1311;--surface:#141C19;--surface-2:#1B2621;--ink:#E3EBE6;--muted:#93A39B;--line:#26332D;--line-strong:#3A4A42;
  --ledger:#4FC395;--ledger-soft:#13291F;--on-ledger:#06251A;--on-deny:#2D0A07;--amber:#F0A637;--amber-soft:#2B2010;--deny:#F2766C;--deny-soft:#2D1514;
  --idle:#8A9B92;--focus:#4FC395;--shadow:0 8px 24px rgb(0 0 0 / .5)}}

/* ============================ base ============================ */
*{box-sizing:border-box}
html{scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 .9375rem/1.5 var(--body);overflow-wrap:anywhere}
[hidden]{display:none!important}
a{color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.5rem,1.1rem + 1.6vw,2.25rem);line-height:1.1;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.25rem;line-height:1.2;font-weight:700}
h3{font-size:1rem;line-height:1.3;font-weight:700}
h1:focus{outline:none}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:.8125rem;line-height:1.4}
.mono{font-family:var(--mono);font-size:.8125rem}
.eyebrow{font:500 .72rem/1.2 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}
.skip{position:absolute;left:8px;top:-60px;z-index:200;background:var(--ledger);color:var(--on-ledger);padding:10px 14px;border-radius:var(--r-md);font-weight:700}
.skip:focus{top:8px}
button{font:inherit;color:inherit;cursor:pointer}
pre{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;overflow-x:auto;font:.8125rem/1.4 var(--mono)}
code{font-family:var(--mono);font-size:.8125rem}

/* ============================ shell ============================ */
.app{display:block;min-height:100vh}
.col{min-width:0}
#top{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
#banner-slot{max-height:42vh;overflow:auto}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;min-height:56px}
.brand{font:800 1.05rem/1 var(--display);letter-spacing:-.02em;white-space:nowrap}
.brand b{color:var(--ledger);margin-right:4px}
.proj{display:flex;flex-direction:column;min-width:0}
.proj .pn{font:600 .875rem/1.2 var(--mono)}
.proj .pp{font-size:.8125rem;color:var(--muted)}
.spacer{flex:1}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ledger);flex:none}
.live[data-s="static"] .dot{background:var(--idle)}
.live[data-s="stale"] .dot,.live[data-s="retry"] .dot{background:var(--amber)}
.live[data-s="down"] .dot{background:var(--deny)}
.live[data-s="live"] .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.hchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r-sm);border:1px solid var(--line-strong);text-decoration:none;font-size:.8125rem;font-weight:600;background:var(--surface);min-height:32px}
.hchip.human{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.hchip.bad{color:var(--deny);border-color:var(--deny);background:var(--deny-soft)}
.hchip.ok{color:var(--ledger);border-color:var(--line-strong)}
#integrity{display:block}
#integrity[data-in="header"]{display:inline-flex;align-items:center;padding:5px 10px;border-radius:var(--r-sm);font-size:.8125rem;font-weight:600;border:1px solid var(--line-strong);background:var(--surface);min-height:32px}
#integrity.ok{color:var(--ledger)}
#integrity.warning[data-in="banner"]{background:var(--amber-soft);color:var(--amber);border-bottom:1px solid var(--amber);padding:10px 16px;font-size:.875rem}
#integrity.broken[data-in="banner"]{background:var(--deny);color:var(--on-deny);padding:12px 16px;font-size:1rem;font-weight:700;line-height:1.35}
#integrity.broken ul,#integrity.warning ul{margin:6px 0 0;padding-left:20px;font-weight:500;font-size:.8125rem}
body[data-integrity="broken"]::before{content:"";position:fixed;inset:0;border:4px solid var(--deny);pointer-events:none;z-index:150}
body[data-integrity="broken"] .card{border-left:3px solid var(--deny)}
#side{position:fixed;z-index:60;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line-strong);box-shadow:var(--shadow)}
#side .grp .sub{display:none}
#side .gl{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;min-height:56px;text-decoration:none;font-size:.72rem;font-weight:600;color:var(--muted);position:relative}
#side .gl .gi{font-size:1.1rem;line-height:1}
#side .gl .gt-full{display:none}
#side [aria-current="page"],#side .grp.on .gl{color:var(--ledger);box-shadow:inset 0 3px 0 var(--ledger)}
.nb{display:inline-block;min-width:20px;padding:0 6px;border-radius:var(--r-sm);font:700 .72rem/1.5 var(--mono);text-align:center;background:var(--surface-2);color:var(--ink);margin-left:6px}
.nb.human{background:var(--amber-soft);color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.nb.bad{background:var(--deny-soft);color:var(--deny);box-shadow:inset 0 0 0 1px var(--deny)}
.nb.ok{background:var(--ledger-soft);color:var(--ledger);box-shadow:inset 0 0 0 1px var(--ledger)}
#side .gl .nb{position:absolute;top:4px;right:calc(50% - 26px);margin:0;min-width:16px;font-size:.65rem}
main{display:block;padding:20px 16px 88px;max-width:1180px;margin:0 auto;width:100%;outline:none}
#view{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
#view>*{min-width:0}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px}
.subtabs a{padding:7px 12px;border:1px solid var(--line-strong);border-radius:var(--r-md);text-decoration:none;font-weight:600;font-size:.875rem;background:var(--surface);white-space:nowrap}
.subtabs a[aria-current="page"]{background:var(--ledger);color:var(--on-ledger);border-color:var(--ledger)}
footer{padding:0 16px 96px;max-width:1180px;margin:0 auto;color:var(--muted);font-size:.8125rem}
@media (min-width:640px){.bar{padding:10px 24px}main{padding:24px 24px 88px}footer{padding:0 24px 96px}}
@media (min-width:1024px){
  .app{display:grid;grid-template-columns:232px minmax(0,1fr)}
  #side{position:sticky;top:0;height:100vh;display:block;overflow-y:auto;border-top:0;border-right:1px solid var(--line);box-shadow:none;padding:18px 12px;background:var(--surface)}
  #side .grp{margin-bottom:14px}
  #side .grp .sub{display:block}
  #side .gl{flex-direction:row;gap:8px;padding:6px 10px;min-height:0;font:600 .72rem/1.2 var(--mono);text-transform:uppercase;letter-spacing:.08em;pointer-events:none;box-shadow:none!important;color:var(--muted)!important}
  #side .gl .gt-short{display:none}#side .gl .gt-full{display:inline}
  #side .gl .gi{display:none}
  #side .sub a{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:var(--r-md);text-decoration:none;font-weight:600;color:var(--ink)}
  #side .sub a:hover{background:var(--surface-2)}
  #side .sub a[aria-current="page"]{background:var(--ledger-soft);color:var(--ledger)}
  main{padding:28px 32px 48px}.bar{padding:10px 32px}footer{padding:0 32px 32px}
  .subtabs{display:none}
}
@media (min-width:1200px){
  #view[data-screen="agora"]{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
  #view[data-screen="agora"]>*{grid-column:1}
  #view[data-screen="agora"]>[data-key="agora:needs"]{grid-column:2;grid-row:1 / span 6;align-self:start;position:sticky;top:84px}
}

/* ============================ componentes ============================ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.card.human{border-left:3px solid var(--amber)}.card.run{border-left:3px solid var(--ledger)}.card.bad{border-left:3px solid var(--deny)}
.card.hero{border-radius:var(--r-lg);padding:20px 22px}
.sec>.sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:10px}
.sec>.sh h2{margin-right:auto}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:var(--r-sm);border:1px solid var(--line-strong);font-size:.78rem;font-weight:600;line-height:1.5;white-space:nowrap;background:var(--surface);color:var(--ink)}
.tag i{font-style:normal}
.tag.wrap{white-space:normal;max-width:100%}
.tag.ok{color:var(--ledger);background:var(--ledger-soft);border-color:var(--ledger)}
.tag.human,.tag.run{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tag.bad{color:var(--deny);background:var(--deny-soft);border-color:var(--deny)}
.tag.idle{color:var(--idle);border-style:dashed}
.chip{display:inline-block;padding:0 7px;border:1px solid var(--line-strong);border-radius:var(--r-sm);font:400 .78rem/1.6 var(--mono);background:var(--surface);color:var(--ink);white-space:nowrap}
.chip.missing{border-style:dashed;color:var(--deny);border-color:var(--deny)}
.chip.wait{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
button.chip{cursor:pointer;font-family:var(--body);font-size:.8125rem;padding:3px 10px;min-height:30px}
button.chip[aria-pressed="true"]{background:var(--ledger);color:var(--on-ledger);border-color:var(--ledger)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:.8125rem;min-height:32px;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--ledger);color:var(--on-ledger);border-color:var(--ledger)}
.cmd{display:flex;align-items:stretch;gap:0;border:1px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden;background:var(--surface-2)}
.cmd code{flex:1;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
.cmd .btn{border:0;border-left:1px solid var(--line-strong);border-radius:0}
.empty{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border:1px dashed var(--line-strong);border-radius:var(--r-md);color:var(--muted);background:var(--surface)}
.empty.ok{border-style:solid;border-color:var(--ledger);background:var(--ledger-soft);color:var(--ink)}
.empty .gi{font-size:1.1rem;line-height:1.3;color:var(--ledger)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.kpi{display:block;background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--ledger);border-radius:var(--r-md);padding:12px 14px;text-decoration:none}
.kpi.human{border-top-color:var(--amber)}.kpi.bad{border-top-color:var(--deny)}
.kpi .n{font:800 2.25rem/1 var(--display);font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:.8125rem;margin-top:4px}
a.kpi:hover{background:var(--surface-2)}
.prog{display:flex;align-items:center;gap:10px}
.prog .track{flex:1;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;min-width:80px}
.prog .fill{height:100%;background:var(--ledger)}
.prog.warn .fill{background:var(--amber)}
.seg{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2);gap:2px}
.seg>span{display:block;min-width:4px}
.seg .s-ok{background:var(--ledger)}.seg .s-run,.seg .s-human{background:var(--amber)}.seg .s-bad{background:var(--deny)}
.seg .s-idle{background:var(--idle);opacity:.55}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
.stepper{list-style:none;margin:0;padding:0;display:flex;gap:0}
.stepper li{flex:1;min-width:0;position:relative;text-align:center;padding-top:30px;font-size:.8125rem;color:var(--idle)}
.stepper li::before{content:"○";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:26px;line-height:24px;border-radius:50%;border:1.5px dashed var(--idle);background:var(--surface);font-size:.8rem}
.stepper li::after{content:"";position:absolute;top:13px;left:calc(50% + 15px);right:calc(-50% + 15px);border-top:2px solid var(--line-strong)}
.stepper li:last-child::after{display:none}
.stepper li.done{color:var(--ink)}
.stepper li.done::before{content:"✓";border:1.5px solid var(--ledger);background:var(--ledger);color:var(--on-ledger);font-weight:800}
.stepper li.done::after{border-top-color:var(--ledger)}
.stepper li.now{color:var(--ink);font-weight:700}
.stepper li.now::before{content:"◐";border:2px solid var(--amber);color:var(--amber);background:var(--amber-soft);font-weight:800}
.stepper li.wait::before{content:"◆"}
.stepper li small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.stepper.mini li{padding-top:22px;font-size:0}.stepper.mini li small,.stepper.mini li span{display:none}
.stepper.mini li::before{width:16px;height:16px;line-height:14px;font-size:.55rem}
.stepper.mini li::after{top:8px;left:calc(50% + 10px);right:calc(-50% + 10px)}
@media (max-width:639px){
  .stepper{flex-direction:column;gap:4px;padding-left:2px}
  .stepper li{text-align:left;padding:2px 0 2px 36px;min-height:26px}
  .stepper li::before{left:0;top:0;transform:none;width:24px;height:24px;line-height:22px}
  .stepper li::after{display:none}
  .stepper.mini{flex-direction:row}.stepper.mini li{padding:0 0 0 0;min-height:0;text-align:center;flex:1;height:18px}.stepper.mini li::before{left:50%;transform:translateX(-50%)}
}
.agent{display:flex;flex-direction:column;gap:8px}
.agent .mono-badge{width:34px;height:34px;border-radius:var(--r-md);background:var(--ledger-soft);color:var(--ledger);display:grid;place-items:center;font:700 .8rem var(--mono);flex:none;border:1px solid var(--ledger)}
.agent .el{white-space:nowrap;font:800 1.6rem/1 var(--display);font-variant-numeric:tabular-nums;margin-left:auto}
.agent .last{font:.8125rem/1.4 var(--mono);color:var(--muted);background:var(--surface-2);padding:6px 8px;border-radius:var(--r-sm);max-height:5.6em;overflow:auto}
.indet{height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--amber) 0 14px,transparent 14px 28px);background-size:56px 100%;animation:slide 1.2s linear infinite}
@keyframes slide{to{background-position:56px 0}}
.lane{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:10px 12px}
.lane+.lane{margin-top:10px}
.lane .lh{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.lr{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr);gap:10px;align-items:center;padding:4px 0}
.lr .lt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8125rem}
.trk{position:relative;height:22px;background:var(--surface-2);border-radius:var(--r-sm);overflow:hidden}
.trk .b{position:absolute;top:3px;bottom:3px;border-radius:3px;background:var(--ledger-soft);border:1.5px solid var(--ledger);min-width:6px}
.trk .b.completed,.trk .b.validated{background:var(--ledger)}
.trk .b.in_progress{background:repeating-linear-gradient(135deg,var(--amber) 0 8px,var(--amber-soft) 8px 16px);border-color:var(--amber);background-size:22px 22px;animation:slide2 1s linear infinite}
@keyframes slide2{to{background-position:22px 0}}
.trk .b.rejected{background:var(--deny-soft);border-color:var(--deny)}
.trk .now{position:absolute;top:0;bottom:0;width:2px;background:var(--amber)}
.planned{border:1px dashed var(--line-strong);border-radius:var(--r-md);padding:10px 12px;background:var(--surface)}
.planned+.planned{margin-top:8px}
@media (max-width:639px){.lr{grid-template-columns:minmax(0,1fr)}.lr .lt{white-space:normal}}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar input[type=search]{font:inherit;padding:6px 10px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);color:var(--ink);min-width:0;flex:1 1 180px;max-width:320px;min-height:34px}
.toolbar .none{flex-basis:100%}
.tablewrap{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow-x:auto}
table.dt{border-collapse:collapse;width:100%}
table.dt th{text-align:left;padding:9px 12px;background:var(--surface-2);font:500 .72rem/1.2 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
table.dt th button{all:unset;cursor:pointer;text-transform:inherit}
table.dt th button:focus-visible{outline:2px solid var(--focus)}
table.dt th[aria-sort]::after{content:" ▲";font-size:.6rem}
table.dt th[aria-sort="descending"]::after{content:" ▼"}
table.dt td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.dt tr:last-child td{border-bottom:0}
table.dt tbody tr:hover{background:var(--surface-2)}
table.dt tr.bad td:first-child{box-shadow:inset 3px 0 0 var(--deny)}
table.dt tr.run td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
table.dt tr.ok td:first-child{box-shadow:inset 3px 0 0 var(--ledger)}
@media (max-width:639px){
  table.dt,table.dt tbody,table.dt tr,table.dt td{display:block;width:100%}
  table.dt thead{display:none}
  table.dt tr{border-bottom:1px solid var(--line-strong);padding:6px 0}
  table.dt td{border:0;padding:4px 12px;display:flex;gap:10px;justify-content:space-between;text-align:right}
  table.dt td::before{content:attr(data-label);font:500 .72rem/1.6 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;flex:none;max-width:45%}
  table.dt td>*{min-width:0}
  .tablewrap{overflow-x:visible}
}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:8px}
.chain .link{padding:4px 9px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);font:.78rem/1.4 var(--mono)}
.chain .link.ok{border-color:var(--ledger);background:var(--ledger-soft);color:var(--ledger)}
.chain .link.bad{border-color:var(--deny);border-style:dashed;color:var(--deny);background:var(--deny-soft)}
.chain .link.idle{border-style:dashed;color:var(--idle)}
.chain .arr{color:var(--muted)}
@media (max-width:639px){.chain{flex-direction:column;align-items:flex-start}.chain .arr{transform:rotate(90deg)}}
.rq{border-left:3px solid var(--idle)}.rq[data-st="covered"]{border-left-color:var(--ledger)}.rq[data-st="broken_link"]{border-left-color:var(--deny)}.rq[data-st="in_progress"]{border-left-color:var(--amber)}
.tl{list-style:none;margin:0;padding:0 0 0 22px;position:relative}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;border-left:2px solid var(--line-strong)}
.tl>li{position:relative;padding:0 0 16px}
.tl>li::before{content:"";position:absolute;left:-22px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--idle);border:3px solid var(--bg)}
.tl>li[data-st="ok"]::before{background:var(--ledger)}.tl>li[data-st="human"]::before{background:var(--amber)}.tl>li[data-st="bad"]::before{background:var(--deny)}
.hb{display:inline-flex;flex-wrap:wrap;gap:2px 12px;padding:3px 8px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);font:.75rem/1.4 var(--mono);color:var(--muted)}
.hb b{color:var(--ink)}
.hb.broken{border-color:var(--deny);color:var(--deny);background:var(--deny-soft)}
details{margin:0}
details>summary{cursor:pointer;font-weight:600;padding:6px 0}
details.acc{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:0 14px}
details.acc>summary{font:700 1rem var(--display);padding:12px 0}
details.acc[open]>summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details.acc>.in{padding-bottom:14px}
.mm{margin:0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:10px 12px}
.mm .mh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.mm .mh .t{margin-right:auto;font-weight:700;font-size:.875rem}
.mm .slot{overflow-x:auto;min-height:40px}
.mm svg{max-width:100%;height:auto;display:block;margin:0 auto}
.skel{height:40px;border-radius:var(--r-sm);background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:shimmer 1.4s linear infinite;color:var(--muted);font-size:.8125rem;padding:10px}
@keyframes shimmer{to{background-position:-200% 0}}
dialog{border:1px solid var(--line-strong);border-radius:var(--r-lg);background:var(--surface);color:var(--ink);padding:14px;max-width:96vw;max-height:92vh;box-shadow:var(--shadow);overflow:auto}
dialog::backdrop{background:rgb(0 0 0 / .55)}
dialog svg{max-width:none;height:auto}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:var(--r-md);box-shadow:var(--shadow);z-index:300;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.flash{animation:flash 2s}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--focus)}100%{box-shadow:0 0 0 0 transparent}}
.bars .br{display:grid;grid-template-columns:minmax(80px,160px) minmax(0,1fr) 36px;gap:10px;align-items:center;margin:4px 0}
.bars .br .tr{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}.bars .br .tr>div{height:100%;background:var(--ledger)}
.fields{width:100%;border-collapse:collapse}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}.kv dt{color:var(--muted)}.kv dd{margin:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (prefers-contrast:more){:root{--line:var(--line-strong)}}
@media (forced-colors:active){.tag,.chip,.card,.hchip{border:1px solid CanvasText}.stepper li::before{border:1.5px solid CanvasText}}

        if (n.getAttribute("data-dk") === k) { if (d.open) n.setAttribute("open", ""); else n.removeAttribute("open"); }
      });
    });
  }
  function reconcile(specs, force) {
    var scr = cur.scr, existing = {};
    Array.prototype.forEach.call(view.children, function (c) { existing[c.getAttribute("data-key")] = c; });
    var ae = document.activeElement, fid = ae && ae.getAttribute ? ae.getAttribute("data-fid") : null;
    var seq = [];
    specs.forEach(function (sp) {
      var key = scr + ":" + sp.key, old = existing[key], sig;
      try { sig = JSON.stringify(sp.deps); } catch (e) { sig = String(Math.random()); }
      var node;
      if (old && old.__sig === sig && !force) node = old;
      else {
        node = sp.build(); node.setAttribute("data-key", key); node.__sig = sig;
        if (!node.id) node.id = "s-" + sp.key.replace(/[^A-Za-z0-9_-]/g, "_");
        if (old) { carryOpen(old, node); view.replaceChild(node, old); }
      }
      seq.push(node); delete existing[key];
    });
    Object.keys(existing).forEach(function (k) { existing[k].remove(); });
    seq.forEach(function (n, i) { if (view.children[i] !== n) view.insertBefore(n, view.children[i] || null); });
    if (fid) Array.prototype.forEach.call(view.querySelectorAll("[data-fid]"), function (el) { if (el.getAttribute("data-fid") === fid && document.activeElement !== el) el.focus({ preventScroll: true }); });
  }
  function renderScreen(force) {
    view.setAttribute("data-screen", cur.scr);
    var specs;
    try { specs = SCREENS[cur.scr](); } catch (e) { specs = [{ key: "err", deps: [String(e)], build: function () { return empty("Erro ao montar esta tela: " + e); } }]; }
    reconcile(specs, force);
  }
  function renderNav() {
    var side = document.getElementById("side"); side.textContent = "";
    var L = live(), blocked = D.tasks.filter(function (t) { return t.status === "blocked"; }).length;
    var badge = { agora: L && L.agents_in_flight.length ? [L.agents_in_flight.length, "ok", " agentes em execução"] : null,
                  trabalho: blocked ? [blocked, "bad", " bloqueadas"] : null,
                  governanca: D.approvals.pending.length ? [D.approvals.pending.length, "human", " pendentes"] : null };
    GROUPS.forEach(function (g) {
      var on = g.items.indexOf(cur.scr) >= 0, b = badge[g.id];
      var gl = h("a", { "class": "gl", href: "#" + g.items[0], "aria-label": g.name + (b ? ", " + b[0] + b[2] : ""), "aria-current": on ? "page" : null },
        h("span", { "class": "gi", "aria-hidden": "true", text: g.glyph }), h("span", { "class": "gt-short", text: g.short }), h("span", { "class": "gt-full", text: g.name }),
        b ? h("span", { "class": "nb " + b[1], "aria-hidden": "true", text: String(b[0]) }) : null);
      if (!on) gl.removeAttribute("aria-current");
      var sub = h("div", { "class": "sub" });
      g.items.forEach(function (s) {
        var a = h("a", { href: "#" + s, text: TITLES[s] }); if (s === cur.scr) a.setAttribute("aria-current", "page");
        if (g.items.length === 1 || s === g.items[0]) { var bb = badge[g.id]; if (bb && s === g.items[0]) a.appendChild(h("span", { "class": "nb " + bb[1], "aria-hidden": "true", text: String(bb[0]) })); }
        sub.appendChild(a);
      });
      side.appendChild(h("div", { "class": "grp" + (on ? " on" : "") }, gl, sub));
    });
  }
  function renderSubtabs() {
    var old = document.getElementById("subtabs"); if (old) old.remove();
    var g = GROUPS.filter(function (x) { return x.items.indexOf(cur.scr) >= 0; })[0];
    if (!g || g.items.length < 2) return;
    var nav = h("nav", { id: "subtabs", "class": "subtabs", "aria-label": "Telas de " + g.name });
    g.items.forEach(function (s) { var a = h("a", { href: "#" + s, text: TITLES[s] }); if (s === cur.scr) a.setAttribute("aria-current", "page"); nav.appendChild(a); });
    view.parentNode.insertBefore(nav, view);
  }
  function setTitle() {
    document.title = (broken() ? "⚠ INTEGRIDADE COMPROMETIDA · " : "") + (D.approvals.pending.length ? "(" + D.approvals.pending.length + ") " : "") +
      "AISEF · " + (D.manifest.project_id || "painel") + " · " + TITLES[cur.scr];
  }
  function route(first) {
    var r = parseHash(), changed = r.scr !== cur.scr || first;
    var canon = r.scr + (r.sec ? "/" + r.sec : "");
    if (location.hash !== "#" + canon && (location.hash || !first)) history.replaceState(null, "", "#" + canon);
    cur = r;
    if (changed) { renderNav(); renderSubtabs(); renderScreen(false); }
    setTitle();
    if (r.sec) {
      var el = document.getElementById("s-" + r.sec);
      if (el) { el.scrollIntoView(); el.classList.add("flash"); setTimeout(function () { el.classList.remove("flash"); }, 2000); }
    } else if (changed && !first) {
      window.scrollTo(0, 0);
      var h1 = view.querySelector("h1"); if (h1) { h1.setAttribute("tabindex", "-1"); h1.focus({ preventScroll: true }); }
    }
  }

  /* ====================================== cabecalho, integridade, ao vivo ====================================== */
  var IS_LIVE = /^https?:$/.test(location.protocol), lastOk = Date.now(), fails = 0, pendingData = null, lastGen = null, genMs = null;
  function renderChrome() {
    var m = D.manifest, L = live(), n = (L && L.next) || {}, st = m.integrity.status, pend = D.approvals.pending.length;
    var crit = D.risks.filter(function (r) { return r.severity === "critical"; }).length;
    var bar = document.getElementById("bar"); bar.textContent = "";
    var ig = document.getElementById("integrity") || h("div", { id: "integrity" });
    ig.textContent = ""; ig.className = st;
    var slot = document.getElementById("banner-slot"); slot.textContent = "";
    document.body.removeAttribute("data-integrity");
    if (st === "ok") {
      ig.setAttribute("data-in", "header"); ig.setAttribute("role", "status");
      ig.appendChild(h("span", { text: "✓ Cadeia íntegra" + (m.source.head_sequence !== null ? " · seq " + m.source.head_sequence : "") }));
      ig.appendChild(h("span", { "class": "sr-only", text: " Integridade do histórico verificada: cadeia, assinaturas e head conferem." }));
    } else {
      ig.setAttribute("data-in", "banner"); ig.setAttribute("role", st === "broken" ? "alert" : "status");
      ig.appendChild(h("div", { text: st === "broken" ? "INTEGRIDADE COMPROMETIDA: o histórico de auditoria não confere. Não confie nos dados abaixo até investigar."
        : "Atenção: integridade verificada com ressalvas." }));
      var items = m.integrity.errors.concat(m.integrity.warnings);
      if (items.length) { var ul = h("ul"); items.forEach(function (t) { ul.appendChild(h("li", { text: t })); }); ig.appendChild(ul); }
      slot.appendChild(ig);
      if (st === "broken") document.body.setAttribute("data-integrity", "broken");
    }
    bar.appendChild(h("span", { "class": "brand" }, h("b", { "aria-hidden": "true", text: "▣" }), "AISEF"));
    bar.appendChild(h("div", { "class": "proj" }, h("span", { "class": "pn", text: m.project_id || "—" }), h("span", { "class": "pp", text: "Fase: " + (L ? (PHASE[n.phase] || n.phase || "—") : "—") })));
    bar.appendChild(h("span", { "class": "spacer" }));
    bar.appendChild(h("span", { "class": "live", id: "liveind", "data-s": IS_LIVE ? "live" : "static" }, h("span", { "class": "dot", "aria-hidden": "true" }), h("span", { id: "livetxt" })));
    bar.appendChild(pend ? h("a", { "class": "hchip human", href: "#governanca/aprovacoes", text: "◆ Precisa de você: " + pend })
                         : h("span", { "class": "hchip ok", text: "✓ Nada depende de você" }));
    if (crit) bar.appendChild(h("a", { "class": "hchip bad", href: "#governanca/riscos", text: "✕ Risco crítico: " + crit }));
    if (st === "ok") bar.appendChild(ig);
    document.getElementById("foot").textContent = "Gerado em " + when(m.generated_at) + " · construtor " + m.builder_version +
      " · log " + (m.source.log_id || "—") + " até a sequência " + (m.source.head_sequence === null ? "—" : m.source.head_sequence) +
      " (" + (m.source.head_hash ? m.source.head_hash.slice(0, 12) : "—") + ")" + (IS_LIVE ? "" : " · página estática: use build_panel.py --serve para acompanhar ao vivo");
    genMs = ptime(m.generated_at); tickLive();
  }
  function tickLive() {
    var el = document.getElementById("liveind"), tx = document.getElementById("livetxt"); if (!el || !tx) return;
    if (!IS_LIVE) { el.setAttribute("data-s", "static"); tx.textContent = "estático · gerado " + when(D.manifest.generated_at); return; }
    var age = (Date.now() - lastOk) / 1000, s = fails >= 3 ? "down" : fails >= 1 ? "retry" : age > 10 ? "stale" : "live";
    el.setAttribute("data-s", s);
    tx.textContent = s === "down" ? "servidor parou — dados de " + new Date(genMs || lastOk).toLocaleTimeString("pt-BR")
      : s === "retry" ? "reconectando…" : s === "stale" ? "ao vivo · parado há " + Math.round(age) + " s" : "ao vivo · atualizado " + ago(lastOk);
  }
  function blocked() {
    var ae = document.activeElement, tn = ae && ae.tagName;
    return !!((window.getSelection && String(window.getSelection())) || tn === "INPUT" || tn === "TEXTAREA" || tn === "SELECT" || document.getElementById("zoom").open);
  }
  function applyData(nd) {
    var prev = pendingIds(), prevStatus = D.manifest.integrity.status, prevAgents = live() ? live().agents_in_flight.length : 0;
    D = nd; renderChrome(); renderNav(); renderSubtabs(); renderScreen(false); setTitle();
    D.approvals.pending.forEach(function (a) { if (prev.indexOf(a.request_id) < 0) announce("Nova aprovação pendente: " + a.title); });
    if (prevStatus !== D.manifest.integrity.status) announce("Integridade do histórico: " + D.manifest.integrity.status);
    if (live() && live().agents_in_flight.length < prevAgents) announce("Um agente terminou.");
  }
  function tick() {
    if (document.hidden) return;
    var now = Date.now();
    Array.prototype.forEach.call(document.querySelectorAll("[data-ago]"), function (e) { e.textContent = ago(Number(e.getAttribute("data-ago"))); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-exp]"), function (e) { e.textContent = inx(Number(e.getAttribute("data-exp"))); });
    if (IS_LIVE) Array.prototype.forEach.call(document.querySelectorAll("[data-base]"), function (e) {
      var b = Number(e.getAttribute("data-base")), g = Number(e.getAttribute("data-gen"));
      if (!isNaN(b) && g) e.textContent = dur(b + (now - g) / 1000);
    });
    tickLive();
    if (pendingData && !blocked()) { var nd = pendingData; pendingData = null; applyData(nd); }
  }
  function poll() {
    var delay = 3000;
    fetch("panel-data.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("http"); return r.json(); }).then(function (nd) {
      fails = 0; lastOk = Date.now();
      if (nd && nd.manifest && nd.manifest.generated_at !== lastGen) { lastGen = nd.manifest.generated_at; pendingData = nd; if (!blocked()) { var x = pendingData; pendingData = null; applyData(x); } }
      setTimeout(poll, delay);
    }).catch(function () { fails++; setTimeout(poll, Math.min(12000, delay * Math.pow(2, fails))); });
  }

  function boot() {
    if (!D) { view.appendChild(h("p", { text: "data.js não encontrado. Gere os dados com build_panel.py e deixe data.js ao lado desta página." })); return; }
    lastGen = D.manifest.generated_at;
    document.getElementById("skip").addEventListener("click", function (e) { e.preventDefault(); var mn = document.getElementById("main"); mn.focus(); mn.scrollIntoView(); });
    document.getElementById("zoom-close").addEventListener("click", function () { document.getElementById("zoom").close(); });
    window.addEventListener("hashchange", function () { route(false); });
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      var onTheme = function () { mmCache = {}; renderScreen(true); };
      if (mq.addEventListener) mq.addEventListener("change", onTheme); else if (mq.addListener) mq.addListener(onTheme);
    }
    renderChrome();
    route(true);
    setInterval(tick, 1000);
    if (IS_LIVE) setTimeout(poll, 3000);
  }
  boot();
})();
</script>
