<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Painel AISEF</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121417'/%3E%3Ctext x='16' y='22' font-family='Segoe UI,Arial,sans-serif' font-size='17' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
/* Layout: trilho de icones 56px + area de trabalho; barra do topo e gaveta de detalhe em vidro (pedido do usuario);
   dados em superficies opacas. Grade da area: 1fr 360px, gap 20px. Estados codificados por forma + icone + cor. */
:root {
  --ground: #f3f4f6; --ground-2: #e9ebef; --surface: #ffffff; --raised: #f6f7f9; --border: #e3e5ea; --rule: #eef0f3;
  --text: #121417; --muted: #5a6070; --faint: #646a79;
  --run: #2862c4; --run-soft: #e6eefb;
  --done: #1f7a52; --done-soft: #e2f3ea;
  --you: #9a5700; --you-soft: #fbefd9;
  --fail: #c03246; --fail-soft: #fbe5e8;
  --wait: #6b7180; --wait-soft: #eef0f3;
  --glass: rgba(255,255,255,.62); --glass-border: rgba(255,255,255,.75); --glass-shadow: 0 10px 30px rgba(20,24,33,.10);
  --edge: #c7ccd6; --edge-active: #2862c4;
  --rev: #6f45c9; --rev-soft: #efe8fb;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", "SF Mono", Consolas, ui-monospace, monospace;
  --r-card: 10px; --r-chip: 6px;
  --m1: #2a78d6; --m2: #eb6834; --m3: #1baf7a; --m4: #eda100;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e0f12; --ground-2: #15171c; --surface: #15171b; --raised: #1c1e23; --border: #262930; --rule: #1f2228;
    --text: #f3f4f6; --muted: #a3a9b6; --faint: #8d93a0;
    --run: #6aa2ff; --run-soft: #17233a; --done: #4cc38a; --done-soft: #14281f; --you: #f0b04a; --you-soft: #2c2312;
    --fail: #ff6b7f; --fail-soft: #2e171c; --wait: #8d93a0; --wait-soft: #1f2228;
    --glass: rgba(24,26,31,.58); --glass-border: rgba(255,255,255,.08); --glass-shadow: 0 12px 34px rgba(0,0,0,.45);
    --edge: #3a3f49; --edge-active: #6aa2ff; color-scheme: dark; --rev: #b49cff; --rev-soft: #241c3a;
    --m1: #3987e5; --m2: #d95926; --m3: #199e70; --m4: #c98500;
  }
}
:root[data-theme="dark"] {
  --ground: #0e0f12; --ground-2: #15171c; --surface: #15171b; --raised: #1c1e23; --border: #262930; --rule: #1f2228;
  --text: #f3f4f6; --muted: #a3a9b6; --faint: #8d93a0;
  --run: #6aa2ff; --run-soft: #17233a; --done: #4cc38a; --done-soft: #14281f; --you: #f0b04a; --you-soft: #2c2312;
  --fail: #ff6b7f; --fail-soft: #2e171c; --wait: #8d93a0; --wait-soft: #1f2228;
  --glass: rgba(24,26,31,.58); --glass-border: rgba(255,255,255,.08); --glass-shadow: 0 12px 34px rgba(0,0,0,.45);
  --edge: #3a3f49; --edge-active: #6aa2ff; color-scheme: dark; --rev: #b49cff; --rev-soft: #241c3a;
  --m1: #3987e5; --m2: #d95926; --m3: #199e70; --m4: #c98500;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--text); font: 14px/1.45 var(--font); }
/* fundo levemente desenhado, para o vidro ter o que desfocar sem brigar com os dados */
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(900px 500px at 85% -10%, var(--run-soft), transparent 70%),
              radial-gradient(700px 420px at -10% 110%, var(--done-soft), transparent 70%); }
button { font: inherit; color: inherit; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }

/* shell */
.rail { position: fixed; inset: 0 auto 0 0; width: 56px; padding-block: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  border-right: 1px solid var(--border); background: var(--ground); z-index: 20; }
.mark { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--text); color: var(--ground); font: 700 13px var(--display); margin-bottom: 14px; }
.rail a { position: relative; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); text-decoration: none; }
.rail a:hover { background: var(--raised); color: var(--text); }
.rail a[aria-current="page"] { color: var(--text); background: var(--raised); }
.rail a[aria-current="page"]::before { content: ""; position: absolute; left: -8px; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: var(--run); }
.rail .badge { position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; font: 600 10.5px/16px var(--font); background: var(--you); color: var(--surface); text-align: center; }
.rail .sep { width: 20px; height: 1px; background: var(--border); margin: 8px 0; }
.rail .tip { position: absolute; left: 50px; white-space: nowrap; padding: 4px 8px; border-radius: 6px; background: var(--text); color: var(--ground); font-size: 12px; opacity: 0; pointer-events: none; transform: translateX(-4px); transition: .12s; }
.rail a:hover .tip, .rail a:focus-visible .tip { opacity: 1; transform: none; }

.app { margin-left: 56px; min-height: 100vh; }
.top { position: sticky; top: 0; z-index: 15; height: 56px; display: flex; align-items: center; gap: 16px;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  background: var(--glass); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border-bottom: 1px solid var(--glass-border); }
.crumb { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; color: var(--muted); }
.crumb b { color: var(--text); font-weight: 600; }
.search { margin-inline: auto; width: min(460px, 40vw); height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--faint); font-size: 13px; cursor: text; }
.search kbd { margin-left: auto; font: 11.5px var(--mono); padding: 1px 6px; border: 1px solid var(--border); border-radius: 5px; }
.live { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--done); box-shadow: 0 0 0 0 var(--done); animation: beat 2s infinite; }
@keyframes beat { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--done) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.seal { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; font-size: 12.5px; color: var(--done); background: var(--done-soft); }
.youbtn { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--you); color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }
:root[data-theme="dark"] .youbtn { color: #1b1305; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .youbtn { color: #1b1305; } }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--muted); cursor: pointer; }

.main { padding: 24px max(24px, env(safe-area-inset-right, 0px)) 56px max(24px, env(safe-area-inset-left, 0px)); display: grid; gap: 20px; }
.titlerow { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.titlerow h1 { margin: 0; font: 600 24px/1.2 var(--display); letter-spacing: -.01em; }
.finding { color: var(--muted); font-size: 14px; margin-top: 4px; max-width: 70ch; }
.finding strong { color: var(--text); font-weight: 600; }
.titlerow .act { margin-left: auto; display: flex; gap: 8px; }
.btn { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.btn.primary { background: var(--text); color: var(--ground); border-color: var(--text); font-weight: 600; }

/* faixa de estados: responde "o que roda e o que espera" num relance */
.states { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }
.state { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; padding: 14px 18px; border: 0; background: none; text-align: left; border-right: 1px solid var(--rule); position: relative; }
.state:last-child { border-right: 0; }
.state .lbl { grid-column: 2; font-size: 12.5px; color: var(--muted); }
.state .val { grid-column: 2; grid-row: 1; font: 600 22px/1.1 var(--mono); }
.state .glyph { grid-row: 1 / span 2; }
.progress { height: 6px; display: flex; gap: 2px; border-radius: 4px; overflow: hidden; }
.progress span { display: block; height: 100%; }

/* glifos de estado: forma + icone, nunca so cor */
.glyph { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; position: relative; }
.glyph svg.i { width: 15px; height: 15px; }
.g-run { color: var(--run); background: var(--run-soft); }
.g-run::before { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--run); border-right-color: var(--run); animation: spin 1.1s linear infinite; }
.g-val { color: var(--run); background: var(--run-soft); }
.g-val::before { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px dashed var(--run); animation: spin 6s linear infinite; }
.g-dep { color: var(--wait); background: transparent; border: 2px dashed var(--edge); }
.g-you { color: var(--you); background: var(--you-soft); box-shadow: 0 0 0 2px var(--you) inset; }
.g-done { color: var(--done); background: var(--done-soft); }
.g-fail { color: var(--fail); background: var(--fail-soft); box-shadow: 0 0 0 2px var(--fail) inset; }
.g-todo { color: var(--wait); background: var(--wait-soft); }
@keyframes spin { to { transform: rotate(360deg); } }

.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: stretch; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); min-width: 0; }
.phead { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--rule); }
.phead h2 { margin: 0; font: 600 15px var(--display); }
.phead .sub { color: var(--faint); font-size: 12.5px; }
.phead .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 5px 10px; font-size: 12.5px; color: var(--muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); font-weight: 600; }

/* mapa de execucao */
.mapwrap { position: relative; overflow: auto; }
/* arrastar com o mouse para navegar (mapa e raias): a mao aparece so quando ha o que rolar */
.mapwrap.can-pan, .lanes.can-pan { cursor: grab; }
.mapwrap.panning, .lanes.panning, .fb-list.panning, .panning * { cursor: grabbing !important; user-select: none; }
.map { position: relative; }
.map svg.edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.edge.active { stroke: var(--edge-active); stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
.edge.blocked { stroke: var(--you); stroke-dasharray: 3 5; }
.edge.spawn { stroke: var(--edge); stroke-dasharray: 2 4; }
@keyframes flow { to { stroke-dashoffset: -12; } }
.colhead { position: absolute; top: 12px; font-size: 12px; color: var(--faint); display: flex; gap: 8px; align-items: center; }
.colhead b { color: var(--muted); font-weight: 600; }
.colband { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--rule); }
.node { position: absolute; width: 228px; display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: center; padding: 10px 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; text-align: left; transition: border-color .12s, box-shadow .12s; }
.node:hover { border-color: var(--edge); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
.node[aria-pressed="true"] { border-color: var(--run); box-shadow: 0 0 0 3px var(--run-soft); }
.node.s-run { border-color: color-mix(in srgb, var(--run) 45%, var(--border)); }
.node.s-you { border-color: color-mix(in srgb, var(--you) 55%, var(--border)); }
.node.s-fail { border-color: color-mix(in srgb, var(--fail) 55%, var(--border)); }
.node.dim { opacity: .35; }
.node .t1 { display: flex; gap: 6px; align-items: baseline; min-width: 0; grid-column: 2; }
.node .id { font: 600 12px var(--mono); color: var(--muted); }
.node .title { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .t2 { grid-column: 2; display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; min-width: 0; }
.node .t2 .id { flex: none; font: 600 11px var(--mono); padding: 0 4px; border-radius: 4px; background: var(--raised); color: var(--muted); }
.node .t2 .meta { overflow: hidden; text-overflow: ellipsis; }
.node .glyph { grid-row: 1 / span 2; }
.node .t2 .st { font-weight: 600; }
.st-run { color: var(--run); } .st-you { color: var(--you); } .st-fail { color: var(--fail); } .st-done { color: var(--done); } .st-dep, .st-todo { color: var(--muted); }
.node.orch { width: 150px; border-style: solid; background: var(--raised); }
.sub-node { position: absolute; height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 6px; border: 1px dashed var(--edge); border-radius: 999px; background: var(--surface); font-size: 12px; color: var(--muted); cursor: pointer; }
.sub-node .mini { width: 18px; height: 18px; }
.sub-node .mini::before { inset: -2px; border-width: 1.5px; }
.flag { position: absolute; display: flex; gap: 5px; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.flag.you { background: var(--you-soft); color: var(--you); }
.flag.fail { background: var(--fail-soft); color: var(--fail); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 18px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--rule); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend .glyph { width: 18px; height: 18px; }
.legend .glyph::before { inset: -2px; border-width: 1.5px; }
.legend .glyph svg.i { width: 10px; height: 10px; }
.legend svg.ln { width: 28px; height: 8px; }

/* coluna direita */
.rcol { display: flex; flex-direction: column; gap: 20px; }
.grid2:not(.nowgrid) > .rcol > :last-child { flex: 1; }
.grid2 > .rcol:has(> .decision) { align-self: start; position: sticky; top: 72px; }
.grid2 > .rcol:has(> .decision) > :last-child { flex: none; }
.decision { align-content: start; }
.decision { background: var(--you-soft); border: 1px solid color-mix(in srgb, var(--you) 35%, transparent); border-radius: var(--r-card); padding: 16px 18px; display: grid; gap: 10px; }
.decision .k { display: flex; gap: 8px; align-items: center; color: var(--you); font-weight: 600; font-size: 13px; }
.decision h3 { margin: 0; font: 600 15px/1.3 var(--display); }
.decision p { margin: 0; color: var(--muted); font-size: 13px; }
.cmd { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); font: 12px var(--mono); overflow-x: auto; }
.cmd code { white-space: nowrap; }
.cmd button { margin-left: auto; flex: none; border: 1px solid var(--border); background: var(--raised); border-radius: 6px; height: 26px; padding: 0 8px; font-size: 12px; cursor: pointer; }
.feed { list-style: none; margin: 0; padding: 6px 0; }
.feed li { display: grid; grid-template-columns: 52px 22px 1fr; gap: 8px; align-items: start; padding: 7px 18px; font-size: 13px; }
.feed time { color: var(--faint); font: 12px var(--mono); padding-top: 2px; }
.feed .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
.feed .ic svg.i { width: 12px; height: 12px; }
.feed b { font-weight: 600; }
.feed .m { color: var(--muted); }

/* raias em paralelo */
.lanes { padding: 8px 18px 16px; overflow-x: auto; }
.lanegrid { position: relative; min-width: 720px; }
.axis { display: grid; grid-template-columns: repeat(4, 1fr); margin-left: 200px; font: 11.5px var(--mono); color: var(--faint); padding: 6px 0; border-bottom: 1px solid var(--rule); }
.lane { display: grid; grid-template-columns: 200px 1fr; align-items: center; height: 40px; border-bottom: 1px solid var(--rule); }
.track { position: relative; height: 100%; }
.bar { position: absolute; top: 11px; height: 18px; text-overflow: clip; border-radius: 5px; font: 600 11px/18px var(--mono); padding: 0 6px; color: var(--surface); white-space: nowrap; overflow: hidden; }
.bar { white-space: pre; }
.bar.run { background: var(--run); background-image: repeating-linear-gradient(-45deg, transparent 0 6px, rgba(255,255,255,.18) 6px 12px); background-size: 34px 34px; animation: stripes 1s linear infinite; }
.bar.done { background: var(--done); } .bar.fail { background: var(--fail); } .bar.you { background: var(--you); }
.bar.val { background: transparent; border: 1.5px dashed var(--run); color: var(--run); line-height: 15px; }
@keyframes stripes { to { background-position: 34px 0; } }
.mk { position: absolute; top: 9px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1.5px solid currentColor; }
.mk svg.i { width: 11px; height: 11px; }
.now { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px solid var(--run); }
.now::before { content: "agora"; position: absolute; top: -20px; left: -16px; font: 600 11px var(--mono); color: var(--run); }

/* tabela de fatias */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--faint); font-size: 12px; padding: 10px 18px; border-bottom: 1px solid var(--rule); }
td { padding: 10px 18px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr:hover td { background: var(--raised); }
td .cell { display: flex; gap: 10px; align-items: center; }
td .glyph { width: 22px; height: 22px; } td .glyph::before { inset: -2px; border-width: 1.5px; } td .glyph svg.i { width: 11px; height: 11px; }
.chip { font: 600 11.5px var(--mono); padding: 1px 6px; border-radius: 5px; background: var(--raised); border: 1px solid var(--border); color: var(--muted); }
.tdd { display: inline-flex; gap: 3px; align-items: center; font: 600 11px var(--mono); }
.tdd i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* gaveta de detalhe (vidro) */
.drawer { position: fixed; top: 68px; right: 12px; bottom: 12px; width: 380px; z-index: 30; display: flex; flex-direction: column;
  background: var(--glass); backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
  border: 1px solid var(--glass-border); border-radius: 16px; box-shadow: var(--glass-shadow); transform: translateX(110%); transition: transform .22s cubic-bezier(.2,.8,.2,1); }
.drawer.open { transform: none; }
.drawer header { display: flex; gap: 12px; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--glass-border); }
.drawer header h3 { margin: 0; font: 600 16px var(--display); }
.drawer .body { overflow: auto; padding: 14px 18px 18px; display: grid; gap: 16px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; font-size: 13px; }
.kv dt { color: var(--faint); } .kv dd { margin: 0; }
.drawer h4 { margin: 0 0 6px; font-size: 12.5px; color: var(--faint); font-weight: 500; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
.steps li { display: grid; grid-template-columns: 84px 1fr; gap: 8px; }
.steps time { color: var(--faint); font: 12px var(--mono); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .top, .drawer { background: var(--surface); } }
@media (prefers-reduced-transparency: reduce) { .top, .drawer { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

/* telas */
.screen h1:focus { outline: none; }
.chain button.lk { background: none; cursor: pointer; font: 600 11.5px var(--mono); color: var(--muted); }
.screen { display: grid; gap: 20px; }
.screen[hidden] { display: none; }
.features { display: grid; gap: 12px; }
.feat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 16px 18px; display: grid; gap: 14px; }
.feat .top1 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.feat h3 { margin: 0; font: 600 15px var(--display); }
.feat .meta { color: var(--faint); font-size: 12.5px; margin-left: auto; }
.stepper { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.stepper li { list-style: none; position: relative; display: grid; justify-items: center; gap: 6px; font-size: 12px; color: var(--faint); text-align: center; }
.stepper li::before { content: ""; position: absolute; top: 14px; left: -50%; right: 50%; height: 2px; background: var(--border); z-index: 0; }
.stepper li:first-child::before { display: none; }
.stepper li.done::before, .stepper li.cur::before { background: var(--done); }
.stepper .glyph { z-index: 1; width: 28px; height: 28px; }
.stepper li.cur { color: var(--text); font-weight: 600; }
.stepper ol { margin: 0; padding: 0; }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.chain .lk { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); font: 600 11.5px var(--mono); }
.chain .lk.ok { color: var(--done); background: var(--done-soft); border-color: transparent; }
.chain .lk.run { color: var(--run); background: var(--run-soft); border-color: transparent; }
.chain .lk.miss { color: var(--muted); border-style: dashed; }
.chain .ar { color: var(--faint); }
.rq { display: grid; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--rule); }
.rq:first-child { border-top: 0; }
.rq .h { display: flex; gap: 10px; align-items: center; font-size: 13.5px; }
.hist { list-style: none; margin: 0; padding: 8px 18px 16px; }
.hist li { display: grid; grid-template-columns: 56px 26px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 13px; }
.hist li:last-child { border-bottom: 0; }
.hist time { color: var(--faint); font: 12px var(--mono); }
.hist .hash { font: 11.5px var(--mono); color: var(--faint); white-space: nowrap; }
.hist .glyph { width: 24px; height: 24px; } .hist .glyph::before { inset: -2px; border-width: 1.5px; } .hist .glyph svg.i { width: 11px; height: 11px; }
.team-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--rule); }
.team-row:first-child { border-top: 0; }
.team-row .n { font-weight: 600; } .team-row .s { font-size: 12.5px; color: var(--faint); }
.team-row .tasks { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.tree { padding: 12px 18px 16px; font-size: 13px; }
.tree ul { list-style: none; margin: 0; padding-left: 22px; border-left: 1px dashed var(--edge); }
.tree > ul { padding-left: 0; border-left: 0; }
.tree li { padding: 5px 0; }
.tree .row { display: inline-flex; gap: 8px; align-items: center; }
.tree .glyph { width: 22px; height: 22px; } .tree .glyph::before { inset: -2px; border-width: 1.5px; } .tree .glyph svg.i { width: 11px; height: 11px; }
.tree .s { color: var(--faint); font-size: 12.5px; }

/* celular: trilho vira barra inferior; mapa vira lista por estado */
.mobilelist { display: none; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 760px) {
  .rail { inset: auto 0 0 0; width: auto; height: 60px; flex-direction: row; justify-content: space-around; padding: 0 8px env(safe-area-inset-bottom, 0px); border-right: 0; border-top: 1px solid var(--border);
    background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .rail .mark, .rail .sep, .rail .hide-m, .rail .tip { display: none; }

  .stepper li:nth-child(4)::before { display: none; }
  .hist li { grid-template-columns: 48px 24px 1fr; } .hist .hash { display: none; }
  th:nth-child(4), td:nth-child(4), th:nth-child(5), td:nth-child(5) { display: none; }
}
.mgroup h3 { margin: 0; padding: 12px 18px 6px; font-size: 12.5px; color: var(--faint); font-weight: 500; }
.mrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 18px; border-top: 1px solid var(--rule); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; }
.mrow .t { font-weight: 600; font-size: 13.5px; } .mrow .s { font-size: 12px; color: var(--faint); }

/* ---- implementacao real (0.10.0): integridade, diagramas, busca, textos longos ---- */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -9999px; top: 8px; z-index: 50; padding: 8px 12px; border-radius: 8px; background: var(--text); color: var(--ground); }
.skip:focus { left: 64px; }
.g-off { color: var(--wait); background: var(--wait-soft); opacity: .7; }
.ibox.broken, .ibox.warning { display: grid; gap: 6px; padding: 14px 18px; border-radius: var(--r-card); font-size: 13.5px; }
.ibox.broken { background: var(--fail); color: var(--surface); font-weight: 600; }
.ibox.warning { background: var(--you-soft); color: var(--text); border: 1px solid color-mix(in srgb, var(--you) 40%, transparent); }
.ibox ul { margin: 0; padding-left: 18px; font-weight: 400; }
.ibox-list { display: grid; gap: 10px; }
.ibox.ib-card { padding: 0; gap: 0; font-weight: 400; }
.ibox.broken.ib-card { background: var(--surface); color: var(--text); border: 1.5px solid var(--fail); }
.ib-head { display: flex; gap: 12px; align-items: flex-start; padding: 14px 18px; background: var(--fail-soft); border-radius: var(--r-card) var(--r-card) 0 0; }
.ib-head > svg.i { color: var(--fail); width: 22px; height: 22px; margin-top: 2px; }
.ib-head h2 { margin: 0 0 4px; font-size: 15px; color: var(--fail); }
.ib-head p { margin: 0; font-size: 13px; color: var(--text); }
.ib-list { list-style: none; margin: 0; padding: 4px 18px; display: grid; }
.ib-row { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-top: 1px solid var(--rule); }
.ib-row:first-child { border-top: 0; }
.ib-body { display: grid; gap: 5px; min-width: 0; font-size: 13px; }
.ib-body p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
.ib-t { font-size: 13.5px; }
.ib-k { color: var(--text); font-weight: 600; }
.ib-ev { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }
.ib-ev b { color: var(--text); }
.ib-raw summary, .ib-more summary { cursor: pointer; font-size: 12px; color: var(--faint); }
.ib-raw code { display: block; margin-top: 4px; white-space: pre-wrap; font: 11.5px/1.5 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.ib-more { padding: 6px 18px 10px; border-top: 1px solid var(--rule); }
.ib-act { display: grid; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--rule); font-size: 13px; }
.ib-act p { margin: 0; }
.ib-cmd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ib-cmd code { flex: 1 1 260px; min-width: 0; padding: 7px 10px; border-radius: 8px; background: var(--raised); font: 12px var(--mono); overflow-wrap: anywhere; }
details.ibox.ib-card { padding: 12px 18px; }
details.ib-card > summary { display: flex; gap: 8px; align-items: center; cursor: pointer; list-style: none; font-size: 13.5px; }
details.ib-card > summary::-webkit-details-marker { display: none; }
details.ib-card .ib-list { padding: 4px 0 0; }
.ib-n { color: var(--muted); font-weight: 400; }
/* foco nunca fica sob o que e fixo (WCAG 2.4.11): o topo de 56 px, a barra inferior do celular e a coluna de rotulos
   fixa das raias. Sem isto, o Tab rolava o controle ate a borda e ele ficava escondido atras dessas faixas. */
html { scroll-padding-top: 68px; }
.lanes { scroll-padding-left: 260px; }
@media (max-width: 760px) { html { scroll-padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); } .lanes { scroll-padding-left: 162px; } }
body[data-integrity="broken"] .cmd, body[data-integrity="broken"] .youbtn { display: none; }
.seal.bad { color: var(--fail); background: var(--fail-soft); }
.seal.warn { color: var(--you); background: var(--you-soft); }
.youbtn[hidden] { display: none; }
.live[data-s="static"] .dot { background: var(--wait); animation: none; }
.live[data-s="retry"] .dot, .live[data-s="stale"] .dot { background: var(--you); animation: none; }
.live[data-s="down"] .dot { background: var(--fail); animation: none; }
.empty { padding: 18px; color: var(--muted); font-size: 13px; display: flex; gap: 10px; align-items: center; }
.empty .glyph { width: 22px; height: 22px; }
.nextbox { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 16px 18px; display: grid; gap: 10px; }
.nextbox .k { display: flex; gap: 8px; align-items: center; color: var(--run); font-weight: 600; font-size: 13px; }
.nextbox h3 { margin: 0; font: 600 15px/1.3 var(--display); }
.nextbox ol { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: grid; gap: 4px; }
.decision + .decision { margin-top: 0; }
.clip1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.clamp2 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.sub-node { max-width: 240px; }
.sub-node .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sub-node .inf { font-size: 10.5px; color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; flex: none; }
.foot { color: var(--faint); font-size: 12px; padding: 0 0 8px; }
figure.mm { margin: 0; }
figure.mm .mh { display: flex; gap: 8px; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--rule); }
figure.mm .mh .t { font-weight: 600; font-size: 13px; margin-right: auto; }
figure.mm .slot { padding: 14px 18px; overflow: auto; }
figure.mm .slot svg { max-width: 100%; height: auto; }
figure.mm pre { white-space: pre-wrap; font: 12px var(--mono); color: var(--muted); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
dialog#zoom { width: min(1200px, 94vw); max-height: 90vh; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text); padding: 16px; }
dialog#zoom::backdrop { background: rgba(0,0,0,.5); }
dialog#zoom svg { max-width: none; }
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rtm-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.rtm-tools input { width: 260px; max-width: 100%; }
.filters input { height: 30px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); padding: 0 10px; font: inherit; font-size: 13px; min-width: 0; }
.dec-opt { font-size: 13px; color: var(--muted); }
.dec-opt b { color: var(--text); }
.lesson { padding: 12px 18px; border-top: 1px solid var(--rule); display: grid; gap: 6px; font-size: 13px; }
.lesson:first-child { border-top: 0; }
.meter { height: 6px; border-radius: 4px; background: var(--wait-soft); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--done); }
.kv.wide { grid-template-columns: 160px 1fr; padding: 14px 18px; }
#p-attn .kv { margin: 0; grid-template-columns: 118px 1fr; }
/* busca global (Ctrl K) */
.palette { position: fixed; inset: 0; z-index: 40; display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; background: rgba(10,12,16,.35); }
.palette.open { display: flex; }
.palette .box { width: min(620px, 92vw); border-radius: 14px; overflow: hidden; background: var(--glass); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
  backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5); }
.palette input { width: 100%; height: 48px; border: 0; border-bottom: 1px solid var(--glass-border); background: transparent; color: var(--text); padding: 0 16px; font: 15px var(--font); outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 52vh; overflow: auto; }
.palette li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
.palette li[aria-selected="true"] { background: var(--raised); }
.palette li .k { font: 11.5px var(--mono); color: var(--faint); }
.palette li .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette .help { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 16px; border-top: 1px solid var(--glass-border); font-size: 12px; color: var(--muted); }
.palette kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .palette .box { background: var(--surface); } }
@media (prefers-reduced-transparency: reduce) { .palette .box { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; } }
@media (forced-colors: active) { .glyph, .node, .chip, .bar { border: 1px solid CanvasText; } }
@media (max-width: 760px) { .lane { grid-template-columns: 120px 1fr; } .axis { margin-left: 120px; } .lanegrid { min-width: 560px; } }

.nowline { left: 200px; }
[hidden] { display: none !important; }
/* ---- cursor, agentes clicaveis, raias ---- */
[data-open], [data-agent], tr[data-open], .seg button, summary { cursor: pointer; }
.lane[data-open]:hover, .lane[data-agent]:hover, tr[data-open]:hover td, .team-row[data-agent]:hover { background: var(--raised); }
.sub-node { font: inherit; font-size: 12px; text-align: left; color: var(--muted); }
.sub-node:hover { border-color: var(--run); color: var(--text); }
.sub-node[aria-pressed="true"] { border-style: solid; border-color: var(--run); box-shadow: 0 0 0 3px var(--run-soft); }
.agent-link { display: flex; gap: 10px; align-items: center; width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: inherit; font: inherit; text-align: left; }
.agent-link:hover { border-color: var(--edge); background: var(--raised); }
.agent-link .glyph { width: 24px; height: 24px; } .agent-link .glyph::before { inset: -2px; border-width: 1.5px; } .agent-link .glyph svg.i { width: 11px; height: 11px; }
.al-t { display: grid; min-width: 0; gap: 2px; font-size: 13px; }
.al-s { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stackv { display: grid; gap: 6px; }
.ask { background: var(--run-soft); border-radius: 10px; padding: 10px 12px; }
.ask h4 { margin: 0 0 4px; color: var(--run); }
.ask p { margin: 0; font-size: 13.5px; overflow-wrap: anywhere; }
.track .mk { width: 20px; height: 20px; margin-left: -10px; top: 10px; z-index: 1; }
.legend .lmk { position: static; margin: 0; display: inline-grid; width: 18px; height: 18px; }
.legend .lsw.bar { position: static; display: inline-block; width: 22px; height: 10px; border-radius: 3px; animation: none; padding: 0; }
.legend .lsw.bar.val { height: 8px; }

/* ---- grafo de dependencias nativo ---- */
.dagwrap { overflow-x: auto; padding: 16px 18px 6px; }
.dag { position: relative; }
.dag .band { position: absolute; left: 0; right: 0; border-radius: 12px; background: color-mix(in srgb, var(--raised) 70%, transparent); border: 1px dashed var(--rule); }
.dag .bandhead { position: absolute; left: 14px; display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); max-width: 90%; }
.dag svg.edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.dedge { fill: none; stroke-width: 1.6; }
.dedge.e-done { stroke: color-mix(in srgb, var(--done) 70%, transparent); }
.dedge.e-run { stroke: var(--run); stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
.dedge.e-you { stroke: var(--you); stroke-dasharray: 3 5; }
.dedge.e-wait { stroke: var(--edge); }
.dedge.crit { stroke-width: 3; }
.ah { stroke: none; } .ah-done { fill: var(--done); } .ah-run { fill: var(--run); } .ah-you { fill: var(--you); } .ah-wait { fill: var(--edge); }
.dnode { position: absolute; display: flex; gap: 10px; align-items: center; padding: 0 12px 0 8px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); cursor: pointer; text-align: left; transition: border-color .12s, box-shadow .12s; color: inherit; font: inherit; }
.dnode:hover { border-color: var(--edge); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
.dnode .glyph { width: 26px; height: 26px; } .dnode .glyph::before { inset: -2px; border-width: 1.5px; } .dnode .glyph svg.i { width: 12px; height: 12px; }
.dnode.s-run { border-color: color-mix(in srgb, var(--run) 45%, var(--border)); }
.dnode.s-you { border-color: color-mix(in srgb, var(--you) 55%, var(--border)); }
.dnode.s-fail { border-color: color-mix(in srgb, var(--fail) 55%, var(--border)); }
.dnode.oncrit { box-shadow: 0 0 0 3px color-mix(in srgb, var(--run) 18%, transparent); }
.dnode.dim { opacity: .35; }
.dn-t { display: grid; min-width: 0; line-height: 1.25; }
.dn-id { font: 600 11px var(--mono); color: var(--muted); }
.dn-title { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend .sw { display: inline-block; width: 26px; height: 0; border-top: 2px solid var(--edge); }
.legend .sw.e-done { border-color: var(--done); } .legend .sw.e-run { border-top-style: dashed; border-color: var(--run); }
.legend .sw.e-you { border-top-style: dotted; border-color: var(--you); } .legend .sw.crit { border-top-width: 4px; border-color: var(--run); }
.dagfoot { display: flex; justify-content: flex-end; padding: 0 18px 14px; }
/* ---- Mermaid (arquitetura e dados) no tema do painel ---- */
figure.mm .slot { background-image: radial-gradient(circle at 1px 1px, var(--rule) 1px, transparent 0); background-size: 18px 18px; border-radius: 0 0 var(--r-card) var(--r-card); }
figure.mm .slot svg { display: block; margin: 0 auto; }
figure.mm svg .node rect, figure.mm svg .node polygon, figure.mm svg .node circle, figure.mm svg .node path { fill: var(--surface) !important; stroke: var(--edge) !important; stroke-width: 1.5px !important; }
figure.mm svg .node rect { rx: 12px; ry: 12px; }
figure.mm svg .node path { fill: var(--done-soft) !important; stroke: var(--done) !important; }
figure.mm svg .nodeLabel, figure.mm svg .node text, figure.mm svg .label text, figure.mm svg text.er, figure.mm svg .er.entityLabel { fill: var(--text) !important; color: var(--text) !important; }
figure.mm svg .flowchart-link, figure.mm svg .edgePath .path, figure.mm svg .relationshipLine { stroke: var(--muted) !important; stroke-width: 1.5px !important; }
figure.mm svg marker path, figure.mm svg .arrowheadPath, figure.mm svg .arrowMarkerPath { fill: var(--muted) !important; stroke: var(--muted) !important; }
figure.mm svg .edgeLabel, figure.mm svg .edgeLabel rect, figure.mm svg .labelBkg { fill: var(--surface) !important; background: var(--surface) !important; }

figure.mm svg .er.entityBox, figure.mm svg g.er rect.er.entityBox { fill: var(--run-soft) !important; stroke: var(--edge) !important; }

figure.mm svg .er.attributeBoxEven, figure.mm svg rect.er.attributeBoxEven { fill: var(--raised) !important; stroke: var(--rule) !important; }
figure.mm svg .cluster rect { fill: var(--raised) !important; stroke: var(--rule) !important; rx: 12px; ry: 12px; }

.glyph, svg.i, .mk, .sub-node .mini { flex: none; }
.cell { display: flex; gap: 10px; align-items: center; min-width: 0; }
.chip, .chain .lk, .tag { white-space: nowrap; }

.cell > span { min-width: 0; }
.crumb { flex: 0 1 auto; min-width: 0; overflow: hidden; }

/* ---- 0.16: mapa por feature, nos com titulo em 2 linhas, historico por dia, filtros ---- */
.node { grid-template-rows: auto auto auto; align-content: center; }
.node .glyph { grid-row: 1 / span 3; }

.node .title { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; line-height: 1.3; overflow-wrap: anywhere; }

.node .nden { position: absolute; top: 6px; right: 8px; color: var(--faint); display: inline-flex; }
.node .nden svg.i { width: 12px; height: 12px; }
.mband { position: absolute; right: 0; border-radius: 12px; background: color-mix(in srgb, var(--raised) 60%, transparent); border: 1px dashed var(--rule); }
.mband.active { border-style: solid; border-color: var(--border); background: transparent; }
.mbandhead { position: absolute; display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); white-space: nowrap; }

.mbandhead .tg { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; height: 24px; padding: 0 8px; font-size: 12px; color: var(--muted); }
.mbandhead .tg:hover { color: var(--text); border-color: var(--edge); }
.chip.ok { color: var(--done); background: var(--done-soft); border-color: transparent; }
.chip.run { color: var(--run); background: var(--run-soft); border-color: transparent; }
.chip.you { color: var(--you); background: var(--you-soft); border-color: transparent; }
.chip.bad { color: var(--fail); background: var(--fail-soft); border-color: transparent; }
.mk.st-todo { color: var(--faint); border-style: dashed; }
.hist li.day { display: block; padding: 14px 0 6px; border-bottom: 0; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.hist li.day:first-child { padding-top: 4px; }
.hist .det { display: block; margin-top: 2px; font: 12px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist .seq { font: 11.5px var(--mono); color: var(--faint); white-space: nowrap; }
.kv dd small { display: block; color: var(--faint); font: 12px var(--font); margin-top: 2px; }
.note { margin: 0; padding: 0 18px 14px; color: var(--faint); font-size: 12px; }
.calmbar { display: flex; gap: 10px; align-items: center; padding: 12px 18px; border-radius: var(--r-card); border: 1px solid var(--border); background: var(--surface); font-size: 13.5px; color: var(--muted); }
.calmbar b { color: var(--text); }
.filters select { height: 30px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); padding: 0 8px; font: inherit; font-size: 12.5px; max-width: 100%; }
.morebar { display: flex; justify-content: center; padding: 10px 18px 14px; border-top: 1px solid var(--rule); }

.phead .tools { max-width: 100%; min-width: 0; }
/* seletor de feature: linha propria abaixo do cabecalho do painel */
.fbar { display: flex; align-items: center; gap: 10px; padding: 8px 18px; border-bottom: 1px solid var(--rule); min-width: 0; }
.fbar button { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border: 1px solid var(--border); border-radius: 999px;
  background: var(--surface); color: var(--muted); font-size: 12.5px; white-space: nowrap; cursor: pointer; transition: background .12s, border-color .12s, color .12s; }

/* pilulas numa linha so: arrasta com o mouse (como o mapa), a roda rola para o lado, o toque desliza e o Tab traz a
   pilula focada para a vista. O esmaecido aparece so no lado em que ha mais pilulas. */
.fb-list { display: flex; gap: 6px; min-width: 0; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; padding: 2px 0; }
.fb-list::-webkit-scrollbar { display: none; }
.fb-list.can-pan { cursor: grab; }
.fb-list.fade-r { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); }

i.fb-dot.g-fail { background: var(--fail); } i.fb-dot.g-dep, i.fb-dot.g-todo, i.fb-dot.g-off { background: var(--edge); box-shadow: none; border: 0; }
/* custo de atencao: icones no canto do mapa, numero sob demanda */

  .fbar { padding-inline: 12px; }
}

.legend .lsep { margin-left: 8px; }
.flows { display: grid; gap: 8px; padding: 6px 0 12px; min-width: max-content; }
.fsec { padding: 10px 18px 6px; }
.fsec + .fsec { border-top: 1px solid var(--rule); }
.fhead { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 12px; font-size: 13px; position: sticky; left: 18px; max-width: calc(100cqw - 36px); }

.fcard { position: absolute; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: border-color .12s, box-shadow .12s; }

.flows.fgraph { gap: 12px; padding: 14px 18px 18px; flex: 1 0 auto; }
.tk-sum { position: sticky; left: 18px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--faint); padding: 0 2px; max-width: calc(100cqw - 36px); }

.fg-leg { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; }
.fg-leg:first-of-type { margin-left: auto; }
.sw-l { display: inline-block; width: 26px; height: 0; border-top: 2px solid var(--muted); }
.sw-l.der { border-top-style: dashed; border-top-color: color-mix(in srgb, var(--muted) 70%, var(--edge)); }
.fmap { position: relative; }
.fmap svg.edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.fg-e { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: stroke .15s, opacity .15s, stroke-width .15s; }
.fg-e.dep { stroke: var(--muted); }
.fg-e.der { stroke: color-mix(in srgb, var(--muted) 70%, var(--edge)); stroke-dasharray: 4 4; }
.fg-e.live { stroke: var(--run); stroke-dasharray: 6 5; animation: flow 1s linear infinite; }
.fg-ah { stroke: none; } .fg-ah-dep { fill: var(--muted); } .fg-ah-der { fill: color-mix(in srgb, var(--muted) 70%, var(--edge)); } .fg-ah-hot { fill: var(--run); }
.fmap.hovering .fg-e { opacity: .25; }
.fmap.hovering .fg-e.hot { opacity: 1; stroke: var(--run); stroke-width: 2.4; }

.fmap-sep { position: absolute; left: 6px; right: 6px; display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--faint); }
.fmap-sep::after { content: ""; flex: 1; border-top: 1px dashed var(--border); }
.fnode { position: absolute; display: grid; grid-template-rows: auto 1fr auto; gap: 6px; padding: 11px 13px 10px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); color: inherit; font: inherit; text-align: left; cursor: pointer; min-width: 0; transition: border-color .15s, box-shadow .15s, transform .15s, opacity .15s; }
.fnode:hover, .fnode:focus-visible { border-color: var(--edge); box-shadow: 0 8px 22px rgba(0,0,0,.12); transform: translateY(-1px); }
.fnode.s-run, .fnode.s-val { border-color: color-mix(in srgb, var(--run) 55%, var(--border)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--run) 14%, transparent); }
.fnode.s-you { border-color: color-mix(in srgb, var(--you) 55%, var(--border)); }

/* ---- Features e fatias: linha do tempo das entregas ---- */

.dl-dot.s-run, .dl-dot.s-val { background: var(--run); } .dl-dot.s-you { background: var(--you); } .dl-dot.s-fail { background: var(--fail); } .dl-dot.s-dep, .dl-dot.s-todo { background: var(--edge); }

.rm-c.t-you:not(.zero) { background: color-mix(in srgb, var(--you) calc(var(--n) * 60%), var(--surface)); }

.rm-c.acc:not(.zero) { outline: 1.5px dashed var(--done); outline-offset: -3px; }
.rm-c.on { box-shadow: 0 0 0 2px var(--text); }
.rm-sw { display: inline-block; width: 14px; height: 3px; background: var(--done); }
/* ---- Historico: a cadeia e quando o trabalho acontece ---- */
.bm-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.dec-disc { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); }
.wh-wrap { padding: 14px 18px 0; overflow-x: auto; }
.wh { display: grid; gap: 3px; min-width: 520px; }
.wh-x { font: 10.5px var(--mono); color: var(--faint); }
.wh-y { font: 11px var(--mono); color: var(--muted); align-self: center; }
.wh-c { height: 18px; border-radius: 3px; background: color-mix(in srgb, var(--m1) calc(var(--a) * 100%), var(--surface)); }
.wh-c.zero { background: var(--raised); }
/* ---- Engenharia: comparativo de blueprints ---- */
table.bm td, table.bm th { vertical-align: middle; }
.bm-r { cursor: pointer; }
.bm-r:hover td { background: var(--raised); }
.bm-r.on td { background: var(--run-soft); }
.bm-r.on td:first-child { box-shadow: inset 3px 0 0 var(--run); }
.bm-n { display: grid; gap: 1px; min-width: 0; }
.bm-n small { color: var(--faint); font-size: 11.5px; }
.bm-dots { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.bm-d { display: inline-block; width: 11px; height: 11px; border-radius: 50%; }
.bm-d.pii { background: var(--you); } .bm-d.pub { background: transparent; border: 1.5px solid var(--edge); }
.bm-d.t-fail { background: var(--fail); } .bm-d.t-you { background: var(--you); } .bm-d.t-done { background: var(--done); }
.bm-d.rev { background: var(--done); border-radius: 3px; } .bm-d.destr { background: var(--fail); border-radius: 3px; } .bm-d.norev { background: var(--you); border-radius: 3px; }

.bm-miss td { color: var(--faint); font-size: 12.5px; }
.bm-miss .mono { color: var(--muted); }
/* ---- Equipe: mapa da equipe e licoes ---- */
.tm { display: grid; gap: 14px; padding: 16px 18px; align-items: start; }
.tm-col { display: grid; gap: 8px; align-content: start; min-width: 0; }
.tm-ch { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; padding: 0 2px 6px; border-bottom: 2px solid var(--edge); }
.tm-col.build .tm-ch { border-color: var(--m1); } .tm-col.review .tm-ch { border-color: var(--rev); } .tm-col.validate .tm-ch { border-color: var(--done); } .tm-col.other .tm-ch { border-color: var(--you); }
.tm-ch b { font-size: 13px; } .tm-ch span { font-size: 11.5px; color: var(--faint); }
.tm-card { display: grid; gap: 8px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.tm-card.live { border-color: color-mix(in srgb, var(--run) 55%, var(--border)); cursor: pointer; }
.tm-card.out { border-style: dashed; border-color: color-mix(in srgb, var(--you) 60%, var(--border)); background: color-mix(in srgb, var(--you) 5%, var(--surface)); }
.tm-h { display: flex; gap: 9px; align-items: center; min-width: 0; }
.tm-h .glyph { width: 24px; height: 24px; flex: none; } .tm-h .glyph::before { inset: -2px; border-width: 1.5px; } .tm-h .glyph svg.i { width: 11px; height: 11px; }
.tm-n { display: grid; min-width: 0; } .tm-n b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .tm-n small { font-size: 11px; color: var(--faint); }
.tm-m { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.tm-m b { color: var(--text); font-weight: 600; }
.tm-nc { color: var(--faint); }
.tm-bar { display: block; height: 4px; border-radius: 3px; background: var(--wait-soft); overflow: hidden; }
.tm-bar i { display: block; height: 100%; background: var(--m2); }
.tm-warn { font-size: 11px; color: var(--you); }
.tm-idle { margin: 0 18px 16px; border-top: 1px solid var(--rule); padding-top: 10px; }
.tm-idle summary { font-size: 12.5px; color: var(--muted); cursor: pointer; }
.tm-chips { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 10px; }
.lc { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; padding: 16px 18px; }
.lc-card { display: grid; gap: 10px; align-content: start; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.lc-top { display: flex; gap: 12px; align-items: center; }
.lc-top > div { display: grid; gap: 4px; }
.lc-num { flex: none; width: 54px; height: 50px; display: grid; place-content: center; text-align: center; border-radius: 10px; background: var(--raised); }
.lc-num b { font-size: 16px; line-height: 1.1; } .lc-num small { font-size: 10.5px; color: var(--muted); }
.lc-num.you { background: var(--you-soft); } .lc-num.you b { color: var(--you); }
.lc-num.fail { background: var(--fail-soft); } .lc-num.fail b { color: var(--fail); }
.lc-num.done { background: var(--done-soft); } .lc-num.done b { color: var(--done); }
.lc-conf { font-size: 11px; color: var(--faint); }
.lc-id { font-size: 12px; font-weight: 600; color: var(--muted); }
.lc-flag { font-size: 11.5px; font-weight: 600; } .lc-flag.you { color: var(--you); } .lc-flag.fail { color: var(--fail); } .lc-flag.done { color: var(--done); }
.lc-when, .lc-then { margin: 0; font-size: 13px; line-height: 1.45; }
.lc-when span, .lc-then span { font-weight: 700; } .lc-when { color: var(--muted); }
@media (max-width: 1100px) { .tm { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } }
@media (max-width: 760px) { .tm { grid-template-columns: minmax(0, 1fr) !important; } .dl-head, .dl-row { grid-template-columns: 220px minmax(0, 1fr); } }
/* ---- paginacao ---- */
.pg { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 18px 12px; border-top: 1px solid var(--rule); }
.pg-n { font-size: 12px; color: var(--muted); }
.pg-btns { display: flex; gap: 4px; align-items: center; }
.pg-b { min-width: 28px; height: 28px; padding: 0 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer; }
.pg-b:hover:not(:disabled) { color: var(--text); background: var(--raised); }
.pg-b.on { background: var(--raised); color: var(--text); font-weight: 600; border-color: var(--edge); }
.pg-b:disabled { opacity: .4; cursor: default; }
.pg-gap { color: var(--faint); padding: 0 4px; }
/* ---- decisoes arquiteturais compactas ---- */
.dc-item { border-top: 1px solid var(--rule); }
.dc-item:first-child { border-top: 0; }
.dc-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 18px; cursor: pointer; list-style: none; }
.dc-row::-webkit-details-marker { display: none; }
.dc-row:hover { background: var(--raised); }
.dc-main { display: grid; gap: 2px; min-width: 0; }
.dc-t { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.dc-t b { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dc-id { font-size: 11.5px; color: var(--muted); flex: none; }
.dc-pick { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dc-meta { display: grid; grid-template-columns: auto 9.5em 7.5em; gap: 14px; align-items: center; justify-items: end; }
.dc-badge { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.dc-badge.ok { color: var(--done); background: var(--done-soft); } .dc-badge.no { color: var(--you); background: var(--you-soft); }
.dc-n { font-size: 11.5px; color: var(--faint); white-space: nowrap; }
.dc-body { display: grid; gap: 8px; padding: 0 18px 14px 50px; font-size: 13px; color: var(--muted); }
.dc-body p { margin: 0; } .dc-body b { color: var(--text); }
.dc-disc { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.dc-risk { color: var(--faint); }
.dc-when { font-variant-numeric: tabular-nums; }
/* ---- riscos: mapa e lista no mesmo painel ---- */
.rsk-map { min-width: 0; }
.rl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 18px 16px; }
.rl > .empty { grid-column: 1 / -1; }
.rl-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 14px 18px 12px; font-size: 13px; border-top: 1px solid var(--rule); }
.rl-hint { color: var(--faint); font-size: 12px; }
.rl-i { display: grid; gap: 6px; align-content: start; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.rl-t { display: flex; gap: 8px; align-items: center; font-size: 12.5px; }
.rl-src { margin-left: auto; font-size: 11px; color: var(--faint); }
.rl-d { margin: 0; font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rl-m { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rl-m b { color: var(--text); font-weight: 600; }
button.rm-h { border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; }
button.rm-h.acc { border-bottom-color: var(--done); }
button.rm-h:hover, button.rm-h.on { color: var(--text); }
.pd .cell .chip { flex: none; }
@media (max-width: 640px) { .pd td:first-child .cell { flex-wrap: wrap; row-gap: 4px; } .pd td:first-child { min-width: 220px; } }
.pd-bad { margin-left: 8px; font: 600 11px var(--font); color: var(--you); background: var(--you-soft); padding: 2px 7px; border-radius: 999px; }
@media (max-width: 900px) {
  .rl { grid-template-columns: minmax(0, 1fr); }
  .dc-row { grid-template-columns: auto minmax(0, 1fr); }
  .dc-meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-start; }
  .dc-body { padding-left: 18px; }
}
/* ---- historico: integridade ---- */
.iv { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 16px 18px; }
.iv-c { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.iv-c.bad { border-color: var(--fail); background: var(--fail-soft); }
.iv-c > div { display: grid; gap: 3px; min-width: 0; }
.iv-k { font-size: 11.5px; color: var(--muted); }
.iv-c b { font-size: 14px; }
.iv-c small { font-size: 12px; color: var(--faint); line-height: 1.4; }
/* ---- rastreabilidade: a matriz navega ---- */
button.pm-l { border: 0; background: none; padding: 0; margin: 0; cursor: pointer; font-family: inherit; font-size: 12px; color: var(--muted); justify-self: start; }
button.pm-l .mono { font-weight: 600; }
button.pm-l:hover, button.pm-l:focus-visible { color: var(--text); text-decoration: underline; }
.pm-g.on { border-color: color-mix(in srgb, var(--run) 55%, transparent); background: color-mix(in srgb, var(--run) 7%, transparent); }
.pm-g.on button.pm-l { color: var(--text); }
.rtm-list .rq:first-child { border-top: 0; }
/* ---- linha das decisoes: tipos clicaveis ---- */
.dln-y.lnk { cursor: pointer; }
.dln-y.lnk:hover, .dln-y.lnk:focus { fill: var(--text); text-decoration: underline; outline: none; }
.cs-feat .pg { padding: 10px 0 0; border-top: 0; }
@media (max-width: 900px) { .iv { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .iv { grid-template-columns: minmax(0, 1fr); } }
/* ---- atalhos da Agora ---- */
.sc-list { display: grid; border-top: 1px solid var(--rule); }
.sc { display: grid; grid-template-columns: 124px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 6px; margin: 0 -6px; border-bottom: 1px solid var(--rule); border-radius: 6px; color: inherit; text-decoration: none; font-size: 12.5px; }
.sc:hover, .sc:focus-visible { background: var(--raised); }
.sc-l { color: var(--faint); }
.sc-v { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); min-width: 0; }
.sc-v b { color: var(--text); font-weight: 600; }
.sc-ar { color: var(--faint); } .sc:hover .sc-ar { color: var(--text); }
button.hbr.lnk { border: 0; background: none; width: 100%; padding: 2px 0; font: inherit; color: inherit; text-align: left; cursor: pointer; border-radius: 4px; }
button.hbr.lnk:hover .hbr-l, button.hbr.lnk:focus-visible .hbr-l { color: var(--text); text-decoration: underline; }
.wtree .pg { margin-top: 4px; }
/* ---- barras de rolagem: finas e na cor do tema ---- */
/* 6 px e invisivel ate o mouse passar pela area que rola (o Chrome so respeita ::-webkit-scrollbar sem scrollbar-width/color;
   o Firefox, que nao tem os pseudo-elementos, usa as propriedades padrao) */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: transparent; border-radius: 999px; }
:hover::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 30%, transparent); }
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--muted) 55%, transparent); }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: transparent transparent; }
  :hover { scrollbar-color: color-mix(in srgb, var(--muted) 30%, transparent) transparent; }
}

/* ---- gaveta: mais larga, opaca e com texto maior ---- */
.drawer { width: min(560px, calc(100vw - 96px)); background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; border-color: var(--border); }
.drawer header { align-items: flex-start; padding: 18px 20px 16px; border-bottom-color: var(--rule); }
.drawer header h3 { font: 600 17px/1.35 var(--display); white-space: normal; overflow: visible; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow-wrap: anywhere; }
.drawer header #d-sub { font-size: 13px !important; margin-top: 3px; }
.drawer .body { padding: 16px 20px 24px; gap: 20px; font-size: 14px; }

.drawer .ask p { font-size: 14px; line-height: 1.5; }
.drawer .dec-opt { font-size: 13.5px; }
.drawer .steps { gap: 0; font-size: 13.5px; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.drawer .steps li { grid-template-columns: 104px 1fr; gap: 12px; padding: 8px 12px; border-top: 1px solid var(--rule); }
.drawer .steps li:first-child { border-top: 0; }
.drawer .steps time { font-size: 12.5px; padding-top: 1px; }
.drawer .steps span { overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.45; }
.drawer .steps .mono { font-size: 12.5px; }
.drawer .agent-link { padding: 10px 12px; }
.dagents { display: grid; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.dag-ph { display: flex; gap: 8px; align-items: center; padding: 7px 12px; background: var(--raised); font-size: 12px; font-weight: 600; color: var(--muted); border-top: 1px solid var(--rule); text-transform: capitalize; }
.dag-ph:first-child { border-top: 0; }
.dag-ph span { margin-left: auto; font: 12px var(--mono); color: var(--faint); }
.dag-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; width: 100%; padding: 9px 12px; border: 0; border-top: 1px solid var(--rule);
  background: var(--surface); color: inherit; font: inherit; font-size: 13.5px; text-align: left; cursor: pointer; }
.dag-row:hover { background: var(--raised); }
.dag-row .glyph { width: 20px; height: 20px; margin-top: 1px; } .dag-row .glyph::before { inset: -2px; border-width: 1.5px; } .dag-row .glyph svg.i { width: 10px; height: 10px; }
.dag-main { display: grid; gap: 2px; min-width: 0; }
.dag-desc { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.dag-when { display: grid; justify-items: end; gap: 2px; font-size: 12px; color: var(--faint); white-space: nowrap; }
@media (max-width: 760px) { .drawer { width: auto; } .drawer .kv { grid-template-columns: 110px 1fr; } .drawer .steps li { grid-template-columns: 1fr; gap: 2px; } }
/* ---- U-01: telas pequenas e baixas, alvos de toque (WCAG 2.5.8, 24 px) ---- */
.searchbtn { display: none; }
@media (max-width: 760px) {
  /* as 8 telas cabem na barra inferior; abaixo de ~340 px ela rola na horizontal em vez de esconder telas */
  .rail { overflow-x: auto; overflow-y: hidden; justify-content: flex-start; gap: 0; scrollbar-width: thin; }
  .rail .hide-m { display: grid; }
  .rail a { flex: 1 0 36px; width: 36px; max-width: 64px; margin: 0 auto; }
  .searchbtn { display: grid; }
  .app { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
}
/* janela baixa: o trilho rola na vertical (as dicas laterais somem nesse caso; o aria-label continua) */
@media (max-height: 500px) and (min-width: 761px) { .rail { overflow-y: auto; scrollbar-width: thin; } .rail .tip { display: none; } .mark { margin-bottom: 6px; flex: none; } .rail .sep { margin: 4px 0; flex: none; } .rail a { flex: none; } }
button.chip, button.pm-l, button.rm-h, .chain button.lk { min-height: 24px; }
button.chip { display: inline-flex; align-items: center; }
.tl-bar::after, .dl-dot::after { content: ""; position: absolute; left: 50%; top: 50%; width: max(100%, 24px); height: 24px; transform: translate(-50%, -50%); }
.chain .lk { max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
.pm-l small.num, .dl-dot.rw b { font-size: 11px; }
@media (max-width: 520px) { .dl-head, .dl-row { grid-template-columns: 150px minmax(0, 1fr); } }
/* 320 px (WCAG 1.4.10, zoom de 400%): nenhum cartao empurra a pagina para o lado */
.hc { grid-template-columns: minmax(0, 1fr); }
.lc { grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); }
.tm-chips .chip { max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
@media (max-width: 360px) { .vc-c:nth-child(even) .vc-x { visibility: hidden; } .hc { padding-inline: 12px; } }
</style>

    var mark = el("a", { cls: "mark", href: "#agora", "aria-label": "AISEF, ir para Agora", text: "A" });

    var pend = (D.approvals.pending || []).length;
    Object.keys(NAMES).forEach(function (k, i) {
      if (k === "eng") rail.appendChild(el("div", { cls: "sep" }));
      var hide = k === "rastro" || k === "hist" || k === "eng";
      var a = el("a", { href: "#" + k, cls: hide ? "hide-m" : null, "aria-label": NAMES[k] + (k === "gov" && pend ? ", " + plural(pend, "decisão sua", "decisões suas") : ""), "aria-current": cur === k ? "page" : null }, [icon(ICONS[k]),
        k === "gov" && pend ? el("span", { cls: "badge", text: String(pend) }) : null, el("span", { cls: "tip", text: NAMES[k] + (k === "gov" && pend ? " · " + plural(pend, "decisão sua", "decisões suas") : "") })]);

  }
  /* U-02: integridade explicada. Cada achado (panel_integrity.py) diz o que aconteceu, como foi detectado, o evento

     depois do ultimo evento integro e antes desta verificacao. Avisos sem adulteracao ficam recolhidos. */
  function integrityCard(ig, m) {
    var det = ig.details || (ig.errors || []).map(function (t) { return { level: "error", title: t, how: [], raw: [t] }; })
      .concat((ig.warnings || []).map(function (t) { return { level: "warning", title: t, how: [], raw: [t] }; }));
    var errs = det.filter(function (d) { return d.level === "error"; }), warns = det.filter(function (d) { return d.level !== "error"; });
    var evs = errs.filter(function (d) { return d.event; }), first = evs[0] && evs[0].event;
    function evLine(e) {
      return el("div", { cls: "ib-ev" }, [el("b", { cls: "mono", text: "#" + e.seq }), el("span", { text: when(e.at) }),
        e.event_type ? el("span", { cls: "mono", text: e.event_type }) : null, e.actor ? el("span", { text: "por " + e.actor }) : null,

      var window_ = !e ? null
        : d.kind === "removed" && b ? "O evento apagado foi gravado entre " + when(b.at) + " (#" + b.seq + ") e " + when(e.at) + " (#" + e.seq + "). Foi tirado do arquivo depois disso e antes desta verificação (" + verif + ")."
        : d.kind === "truncated" ? "Depois de " + when(e.at) + " (#" + e.seq + ", o último que restou) e antes desta verificação (" + verif + ")."
        : "Depois de " + when(e.at) + ", quando o #" + e.seq + " foi gravado, e antes desta verificação (" + verif + ").";
      return el("li", { cls: "ib-row " + d.level }, [
        glyph(d.level === "error" ? "fail" : "you"),
        el("div", { cls: "ib-body" }, [
          el("b", { cls: "ib-t", text: d.title + (d.missing ? " (" + plural(d.missing, "evento apagado", "eventos apagados") + ")" : "") + (d.stream ? " · log de " + d.stream : "") }),
          e && gap && b ? el("div", { cls: "ib-ev" }, [el("span", { text: "Entre " }), el("b", { cls: "mono", text: "#" + b.seq }), el("span", { text: when(b.at) }),
            el("span", { text: "e" }), el("b", { cls: "mono", text: "#" + e.seq }), el("span", { text: when(e.at) })]) : e ? evLine(e) : null,
          e && e.summary && !gap ? el("p", { cls: "ib-sum" }, [el("span", { cls: "ib-k", text: d.kind === "truncated" ? "Último evento que restou: " : "O que o evento dizia: " }), e.summary]) : null,
          (d.how || []).length ? el("p", {}, [el("span", { cls: "ib-k", text: "Como foi detectado: " }), d.how.join(" ")]) : null,
          window_ && d.level === "error" ? el("p", {}, [el("span", { cls: "ib-k", text: "Quando pode ter acontecido: " }), window_]) : null,
          el("details", { cls: "ib-raw" }, [el("summary", { text: "Mensagem do verificador" }), el("code", { text: (d.raw || []).join(" · ") })])])]);
    }
    var vcmd = "python -I <CORE>/aisef_project.py verify --project .", cb = el("button", { cls: "btn sm", type: "button", text: "Copiar" });
    cb.addEventListener("click", function () { copyText(vcmd, cb); });
    if (!errs.length) {  // so avisos: nada foi adulterado, fica recolhido
      return el("details", { cls: "ibox warning ib-card", role: "status" }, [
        el("summary", {}, [icon("i-shield"), el("b", { text: "Integridade verificada com ressalvas" }), el("span", { cls: "ib-n", text: " · " + plural(warns.length, "ponto", "pontos") + " a conferir, nenhuma adulteração" })]),
        el("ul", { cls: "ib-list" }, warns.map(row))]);
    }
    return el("section", { cls: "ibox broken ib-card", role: "alert", "aria-labelledby": "ib-h" }, [
      el("div", { cls: "ib-head" }, [icon("i-shield"), el("div", {}, [
        el("h2", { id: "ib-h", text: "O histórico de auditoria foi adulterado" }),
        el("p", { text: (evs.length ? plural(evs.length, "evento afetado", "eventos afetados") + (first ? ", o primeiro é o #" + first.seq + " (registrado em " + when(first.at) + ")" : "") + ". " : "")
          + "Verificado em " + when(m.generated_at) + ". Não confie nos dados abaixo até investigar; os comandos de aprovar foram ocultados." })])]),
      el("ol", { cls: "ib-list" }, errs.map(row)),
      warns.length ? el("details", { cls: "ib-more" }, [el("summary", { text: plural(warns.length, "outro ponto a conferir", "outros pontos a conferir") }), el("ul", { cls: "ib-list" }, warns.map(row))]) : null,
      el("div", { cls: "ib-act" }, [el("p", { text: "O que fazer: rode a verificação para ver os detalhes e compare o log com o Git (git log -p .aisef/audit/) para achar quando o arquivo mudou." }),
        el("div", { cls: "ib-cmd" }, [el("code", { text: vcmd }), cb])])]);
  }
  function renderTop() {
    var m = D.manifest, ig = m.integrity, pend = (D.approvals.pending || []).length;
    document.getElementById("crumb").textContent = "";
    document.getElementById("crumb").appendChild(el("b", { text: m.project_id || "—" }));
    document.getElementById("crumb").appendChild(el("span", { text: "/" }));
    document.getElementById("crumb").appendChild(el("span", { text: NAMES[cur] }));

    seal.title = ig.status === "ok" ? "" : "Veja o aviso de integridade";
    seal.textContent = "";
    if (ig.status === "ok") seal.appendChild(el("span", { cls: "sr-only", text: "Integridade do histórico verificada (evento #" + m.source.head_sequence + ")." }));
