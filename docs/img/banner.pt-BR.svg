<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="AISEF — Agentes rápidos são fáceis. Agentes que você pode auditar, não.">
  <title>AISEF — Agentes rápidos são fáceis. Agentes que você pode auditar, não.</title>
  <style>
    .tw { animation: tw 4s ease-in-out infinite; }
    .tw1 { animation-delay: -1s; } .tw2 { animation-delay: -2.2s; } .tw3 { animation-delay: -3.1s; }
    @keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
    .st { fill: none; stroke: url(#streak); stroke-linecap: round; animation: orbit 3.2s linear infinite; }
    .s1 { animation-duration: 4.4s; } .s2 { animation-duration: 6s; } .s3 { animation-duration: 8.5s; }
    @keyframes orbit { to { stroke-dashoffset: -480; } }
    .halo { animation: breathe 6s ease-in-out infinite; transform-origin: 905px 205px; }
    @keyframes breathe { 0%, 100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.025); } }
    .ring { animation: flicker 2.6s ease-in-out infinite; }
    @keyframes flicker { 0%, 100% { opacity: .95; } 50% { opacity: .7; } }
    @media (prefers-reduced-motion: reduce) { .tw, .st, .halo, .ring { animation: none; } }
    .h1 { font: 800 104px/1 "Segoe UI Variable Display", "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; letter-spacing: 10px; }
    .h2 { font: 600 25px/1.2 "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
    .h3 { font: 500 14px/1 "Cascadia Mono", "SF Mono", Consolas, ui-monospace, monospace; letter-spacing: .5px; }
  </style>
  <defs>
    <radialGradient id="space" cx="0.707" cy="0.512" r="1.05">
      <stop offset="0" stop-color="#1a0e24"/><stop offset=".35" stop-color="#0a0812"/><stop offset="1" stop-color="#020205"/>
    </radialGradient>
    <radialGradient id="glow" cx="905" cy="205" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity=".55"/><stop offset=".35" stop-color="#ff5e1a" stop-opacity=".18"/><stop offset="1" stop-color="#ff5e1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="doppler" x1="545" y1="0" x2="1265" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf0"/><stop offset=".3" stop-color="#ffe2a8"/><stop offset=".62" stop-color="#ffa040"/><stop offset="1" stop-color="#d9480f"/>
    </linearGradient>
    <linearGradient id="streak" x1="545" y1="0" x2="1265" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#ffd48a"/><stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <radialGradient id="disk" cx="905" cy="205" r="360" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 205) scale(1 .1) translate(0 -205)">
      <stop offset=".2" stop-color="#fff6e0"/><stop offset=".45" stop-color="#ffc56b"/><stop offset=".75" stop-color="#ff6a1a" stop-opacity=".55"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#ffe7c2"/><stop offset="1" stop-color="#ffb366"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020205" stop-opacity=".92"/><stop offset=".42" stop-color="#020205" stop-opacity=".55"/><stop offset=".62" stop-color="#020205" stop-opacity="0"/>
    </linearGradient>
    <filter id="b4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="b10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="b28" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="nebula" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".006 .012" numOctaves="3" seed="7"/>
      <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .18  0 0 0 0 .7  0 0 0 1.1 -.55"/><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="top"><rect x="0" y="0" width="1280" height="205"/></clipPath>
    <clipPath id="bottom"><rect x="0" y="205" width="1280" height="195"/></clipPath>
  </defs>

